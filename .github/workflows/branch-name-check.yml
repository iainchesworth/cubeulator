name: Branch Name Check

# Enforces the project's gitflow branch naming convention: branches must be
# feature/*, release/*, hotfix/*, bugfix/*, or support/* — main and develop
# are the only long-lived branches.
#
# dependabot/* branches are allowed into develop too: Dependabot's branch
# prefix isn't configurable to match gitflow, so it's special-cased here
# instead (target-branch: develop is set in .github/dependabot.yml).
#
# develop's merge queue (see docs/branch-protection.md) needs "Validate
# gitflow branch name" to report on its temporary gh-readonly-queue/...
# ref, so this workflow also triggers on merge_group. A queue entry has no
# head_ref - the name was already checked when the pull request was
# opened - so the job is skipped there, and a skipped job counts as a pass
# for a required check.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main, develop]
  merge_group:
    branches: [develop]

permissions: {}

jobs:
  check-branch-name:
    name: Validate gitflow branch name
    if: github.event_name == 'pull_request'
    # Routed by the CONTROL_RUNNER_JSON repository variable (a runner-label
    # JSON array; unset means GitHub-hosted, deleting it switches back). A
    # fork PR is pinned to the hosted image whatever the variable says: fork
    # code must never reach a self-hosted runner. See docs/ci.md.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-24.04"]') || fromJSON(vars.CONTROL_RUNNER_JSON || '["ubuntu-24.04"]') }}
    steps:
      - name: Validate source and target branch pairing
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Source branch: $HEAD_REF"
          echo "Target branch: $BASE_REF"

          gitflow_prefix_re='^(feature|bugfix|release|hotfix|support)/[A-Za-z0-9._-]+$'

          # An investigation. It is welcome on the remote (push it, run CI legs
          # by dispatch, show it), and it is never merged: this is what makes
          # that true, on a required check. See docs/investigations/README.md.
          if [[ "$HEAD_REF" == spike/* ]]; then
            echo "::error::'$HEAD_REF' is a spike branch: an investigation, which is not merged. Land what it found as a docs page (docs/investigations/) and the code, if any, from a feature/* or bugfix/* branch."
            exit 1
          fi

          if [[ "$BASE_REF" == "main" ]]; then
            allowed_re='^(release|hotfix|support)/[A-Za-z0-9._-]+$'
            if [[ "$HEAD_REF" == "develop" ]] || [[ "$HEAD_REF" =~ $allowed_re ]]; then
              echo "OK: '$HEAD_REF' is a valid source for a PR into 'main'."
            else
              echo "::error::Branch '$HEAD_REF' is not allowed to target 'main'. Only 'release/*', 'hotfix/*', 'support/*', or 'develop' may open PRs against 'main'."
              exit 1
            fi
          elif [[ "$BASE_REF" == "develop" ]]; then
            if [[ "$HEAD_REF" =~ $gitflow_prefix_re ]] || [[ "$HEAD_REF" =~ ^dependabot/ ]]; then
              echo "OK: '$HEAD_REF' follows the gitflow naming convention."
            else
              echo "::error::Branch '$HEAD_REF' does not follow the gitflow naming convention. Expected one of: feature/*, bugfix/*, release/*, hotfix/*, support/*, dependabot/*."
              exit 1
            fi
          else
            echo "::error::Unexpected target branch '$BASE_REF'."
            exit 1
          fi
