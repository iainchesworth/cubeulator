name: OSSF Scorecard

# Supply-chain security health score for the published repo — runs against
# 'main' only. Visible-only: results are a score/badge, not a pass/fail check.
#
# The README's badge reads "invalid repo path" until this has published a
# result, and it publishes only from a run on the default branch (main), so the
# first result comes from the first push there: the first release's merge.
# `python tools/release/check_health.py --scorecard` says whether it has. The
# triggers are Scorecard's own recommended set; branch_protection_rule re-runs
# the analysis when the rulesets change, so the score follows them.
#
# The restrictions the Scorecard API puts on a workflow that publishes (no
# top-level env or defaults, no write permission at the top, id-token: write
# only here, and only checkout, upload-sarif and scorecard-action steps on a
# hosted Ubuntu runner) are kept; adding a `run:` step here would make the API
# reject the result and leave the badge red.
#
# The branch-protection sub-check needs read access to repo settings to
# score fully; without a token it degrades gracefully rather than failing.
# To get the fuller score, add a fine-grained PAT (read-only,
# "Administration: read") as a repo secret named SCORECARD_READ_TOKEN and
# uncomment repo_token below.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
