name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # Caps vcpkg's internal build parallelism - see the equivalent comment
    # on build-and-test below (onnxruntime OOM'd this runner at full nproc
    # parallelism).
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    steps:
      # fetch-depth: 0 is required for vcpkg's version resolution - see the
      # equivalent comment on build-and-test below.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-linux-gcc-debug-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-linux-gcc-debug-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15

      # bgfx's vcpkg port unconditionally find_package(X11)s - see the
      # equivalent comment on build-and-test below.
      - name: Install bgfx build dependencies
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Configure (library + platform only, no Qt app)
        run: >
          cmake --preset linux-gcc-debug
          -DCMAKE_CXX_COMPILER=g++-15
          -DCUBEULATOR_BUILD_APP=OFF

      # A full build (not just configure) is required here: Ninja's compile
      # commands reference a "@....modmap" response file that only exists
      # after a real build (C++20 modules dependency-scanning support) -
      # running clang-tidy standalone against a configure-only tree errors
      # on that missing file for every translation unit (confirmed locally).
      - name: Build
        run: cmake --build --preset linux-gcc-debug

      # .clang-tidy itself leaves WarningsAsErrors empty (local/IDE use stays
      # advisory-only, matching CountdownSolver's convention), so
      # --warnings-as-errors is passed explicitly here to make this a real
      # gate rather than a step that always exits 0. jq is preinstalled on
      # GitHub-hosted runners.
      - name: Run clang-tidy
        run: |
          jq -r '.[].file' build/linux-gcc-debug/compile_commands.json \
            | grep -E '/(src|tests)/' \
            | xargs clang-tidy -p build/linux-gcc-debug --warnings-as-errors='*'

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Caps vcpkg's internal build parallelism (used for every port it
    # compiles, including a single heavy port's own --parallel build step).
    # Confirmed in CI: building onnxruntime with the runner's default
    # nproc-wide parallelism (4 on these standard runners) OOM'd the whole
    # runner (exit 143, "runner has received a shutdown signal") partway
    # through compiling it, well after its ~30 Boost/Abseil transitive
    # dependencies had already built and cached successfully at full
    # parallelism - onnxruntime's own translation units are large/heavy
    # enough that 4 of them compiling at once exceeds the runner's memory.
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC 15, Debug)
            os: ubuntu-24.04
            preset: linux-gcc-debug
          - name: Linux (GCC 15, Release)
            os: ubuntu-24.04
            preset: linux-gcc-release
          - name: macOS (AppleClang, Debug)
            os: macos-15
            preset: macos-clang-debug
          - name: macOS (AppleClang, Release)
            os: macos-15
            preset: macos-clang-release
          - name: Windows (MSVC, Debug)
            os: windows-2025
            preset: windows-msvc-debug
          - name: Windows (MSVC, Release)
            os: windows-2025
            preset: windows-msvc-release

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # vcpkg's x-gha binary caching provider was removed; 'files' +
      # actions/cache is the simplest supported replacement. Set via
      # GITHUB_ENV since the 'runner' context isn't available in job-level env:.
      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-${{ matrix.preset }}-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      - name: Install GCC 15 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15

      # bgfx's vcpkg port unconditionally find_package(X11)s even with
      # examples/tools disabled; GitHub's ubuntu-24.04 runner doesn't ship
      # these dev headers by default (confirmed in CI: bgfx's source build
      # failed with "Could NOT find X11").
      - name: Install bgfx build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Prebuilt Qt (official binaries) so the GUI app builds without
      # compiling Qt from source. Sets QT_ROOT_DIR for find_package(Qt6).
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-15' || '' }}
        run: cmake --preset "$CMAKE_PRESET" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" $EXTRA_CXX_COMPILER

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  android-build:
    name: Android (arm64-v8a, ${{ matrix.config }}, build-only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-android-clang-${{ matrix.config }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-android-clang-${{ matrix.config }}-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # No Qt install needed: the android-clang-* presets set
      # CUBEULATOR_BUILD_APP=OFF (see docs/dependency-strategy.md - mobile
      # shells are native, not Qt/QML). vcpkg is used here only for fmt
      # (chainloaded onto the NDK toolchain); OpenCV/ONNX Runtime/bgfx remain
      # desktop-only - see docs/dependency-strategy.md.
      - name: Configure
        run: cmake --preset android-clang-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset android-clang-${{ matrix.config }}

  ios-build:
    name: iOS (device, ${{ matrix.config }}, build-only, unsigned)
    runs-on: macos-15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-ios-clang-${{ matrix.config }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-ios-clang-${{ matrix.config }}-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # Unsigned build only (see the ios-clang-* preset's
      # CODE_SIGNING_ALLOWED=NO cache vars) - no Apple Developer certificate
      # is available in this job. No Qt install needed - see the android job
      # comment above; the same reasoning applies here. vcpkg is used here
      # only for fmt - see the android job comment above.
      - name: Configure
        run: cmake --preset ios-clang-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ios-clang-${{ matrix.config }}

  coverage:
    name: Coverage (Linux, GCC)
    runs-on: ubuntu-24.04
    # Caps vcpkg's internal build parallelism - see the equivalent comment
    # on build-and-test above (onnxruntime OOM'd this runner at full nproc
    # parallelism).
    env:
      VCPKG_MAX_CONCURRENCY: "2"

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-linux-gcc-coverage-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-linux-gcc-coverage-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      - name: Install GCC 15 (Linux)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15

      # bgfx's vcpkg port unconditionally find_package(X11)s - see the
      # equivalent comment in the build-and-test job above.
      - name: Install bgfx build dependencies
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Install gcovr
        run: pip install --quiet gcovr

      # No GUI app needed to measure coverage of cube::lib/cube::platform, so
      # this leg skips the Qt install entirely.
      - name: Configure
        run: >
          cmake --preset linux-gcc-coverage
          -DCMAKE_CXX_COMPILER=g++-15
          -DCUBEULATOR_BUILD_APP=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-coverage

      - name: Test
        run: ctest --preset linux-gcc-coverage

      - name: Coverage report + gate
        run: >
          gcovr --root . --filter 'src/.*'
          --gcov-executable gcov-15
          --exclude-throw-branches --exclude-unreachable-branches
          --gcov-ignore-errors=no_working_dir_found
          --object-directory build/linux-gcc-coverage
          --print-summary --html-details build/coverage.html
          --fail-under-line 80 --fail-under-branch 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage*.html
