name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs can name the legs they want, so a fix to one platform does
  # not pay for all of them (the full matrix is hours of hosted runners and
  # the pool is shared with other repositories):
  #   gh workflow run ci.yml --ref <branch> -f legs=macos
  # Jobs of a dispatched run are renamed "dispatch - <name>", so a run that
  # skips legs can never report a check under a required check's name on the
  # branch's head commit.
  workflow_dispatch:
    inputs:
      legs:
        description: >-
          Comma-separated legs to run: clang-format, clang-tidy, linux, macos,
          windows, coverage, android, ios - or "all".
        type: string
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.legs }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - clang-format' || 'clang-format' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',clang-format,') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - clang-tidy' || 'clang-tidy' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',clang-tidy,') }}
    runs-on: ubuntu-26.04
    # Caps vcpkg's internal build parallelism - see the equivalent comment
    # on build-and-test below (onnxruntime OOM'd this runner at full nproc
    # parallelism).
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    steps:
      # fetch-depth: 0 is required for vcpkg's version resolution - see the
      # equivalent comment on build-and-test below.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Keyed per vcpkg triplet (x64-linux), shared with build-and-test's
      # Linux legs and the coverage job - see the fuller comment there on
      # why per-preset keys were wasteful/over quota.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-x64-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-x64-linux-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # Three vcpkg build gaps on ubuntu-26.04 - see the fuller comment on
      # build-and-test in ci.yml (X11 for bgfx, autotools for gperf, GLU for glew).
      - name: Install vcpkg build dependencies
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev libglu1-mesa-dev

      # clang-tidy uses its own clang frontend to parse the compile commands
      # regardless of which compiler actually built the code, so this job
      # compiles with clang++ rather than GCC to avoid a cross-toolchain
      # parsing mismatch entirely (it only needs to statically analyze the
      # code, not test GCC-specific behavior - that's the build-and-test
      # job's Linux leg). Ubuntu 24.04's *default* apt clang/clang-tidy
      # package was 1:18.0 (noble's stock version), too old to parse
      # <expected> at all - cascading into "no template named 'Result'"/"no
      # member 'expected'" errors on every file (confirmed in CI on that
      # image). ubuntu-26.04 ships clang-21 directly (20/21/22 side by side),
      # so no LLVM apt-repo pin is needed anymore - just install it.
      #
      # libomp-21-dev: the vendored M3T tracker (third_party/m3t) does
      # find_package(OpenMP REQUIRED) for C and C++. GCC ships libgomp, but
      # clang++ only has an OpenMP runtime with LLVM's libomp, so without it
      # configure stops at "Could NOT find OpenMP_CXX (missing:
      # OpenMP_CXX_FLAGS OpenMP_CXX_LIB_NAMES)" (reproduced on Ubuntu 26.04).
      - name: Install Clang 21
        run: sudo apt-get install -y clang-21 clang-tidy-21 libomp-21-dev

      - name: Configure (library + platform only, no Qt app)
        run: >
          cmake --preset linux-gcc-debug
          -DCMAKE_CXX_COMPILER=clang++-21
          -DCUBEULATOR_BUILD_APP=OFF

      # A full build (not just configure) is required here: Ninja's compile
      # commands reference a "@....modmap" response file that only exists
      # after a real build (C++20 modules dependency-scanning support) -
      # running clang-tidy standalone against a configure-only tree errors
      # on that missing file for every translation unit (confirmed locally).
      - name: Build
        run: cmake --build --preset linux-gcc-debug

      # .clang-tidy itself leaves WarningsAsErrors empty (local/IDE use stays
      # advisory-only, matching CountdownSolver's convention), so
      # --warnings-as-errors is passed explicitly here to make this a real
      # gate rather than a step that always exits 0. jq is preinstalled on
      # GitHub-hosted runners.
      - name: Run clang-tidy
        run: |
          jq -r '.[].file' build/linux-gcc-debug/compile_commands.json \
            | grep -E '/(src|tests)/' \
            | xargs clang-tidy-21 -p build/linux-gcc-debug --warnings-as-errors='*'

  # Picks the desktop build legs. A push, pull request or merge_group run
  # always gets all three; only a manual dispatch can narrow it. The matrix
  # lives here, as JSON, because a job-level `if` cannot see `matrix` - this
  # is the one place the legs are defined.
  plan:
    name: Plan build legs
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select build legs
        id: plan
        shell: bash
        env:
          LEGS: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'all' }}
        run: |
          # Pinned to macos-15, not the newer macos-26: confirmed in CI that
          # macos-26's Xcode/SDK has dropped AGL.framework, which Qt 6.8.3
          # links unconditionally on macOS ("ld: framework 'AGL' not
          # found"). Revisit once Qt or vcpkg's mobile ports account for it.
          all='[
            {"leg": "linux",   "name": "Linux (GCC 15)",     "os": "ubuntu-26.04",        "preset": "linux-gcc-release",   "triplet": "x64-linux"},
            {"leg": "macos",   "name": "macOS (AppleClang)", "os": "macos-15",            "preset": "macos-clang-release", "triplet": "arm64-osx"},
            {"leg": "windows", "name": "Windows (MSVC)",     "os": "windows-2025-vs2026", "preset": "windows-msvc-release", "triplet": "x64-windows"}
          ]'
          for leg in ${LEGS//,/ }; do
            case "$leg" in
              all|clang-format|clang-tidy|linux|macos|windows|coverage|android|ios) ;;
              *) echo "::error::unknown leg '$leg' (clang-format, clang-tidy, linux, macos, windows, coverage, android, ios, all)"
                 exit 1 ;;
            esac
          done
          if [ -z "$LEGS" ] || [ "$LEGS" = all ]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg legs ",${LEGS// /},"               '[.[] | select(.leg as $leg | $legs | contains("," + $leg + ","))]' <<<"$all")
          fi
          count=$(jq 'length' <<<"$selected")
          # Only the desktop legs are chosen here; a dispatch that names just
          # clang-format, android, ios or coverage legitimately selects none.
          echo "legs: $LEGS -> $count desktop leg(s)"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ github.event_name == 'workflow_dispatch' && format('dispatch - {0}', matrix.name) || matrix.name }}
    needs: plan
    # The matrix is empty when a dispatch names no desktop leg, which would
    # otherwise be an error rather than a skip.
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    # Caps vcpkg's internal build parallelism (used for every port it
    # compiles, including a single heavy port's own --parallel build step).
    # Confirmed in CI: building onnxruntime with the runner's default
    # nproc-wide parallelism (4 on these standard runners) OOM'd the whole
    # runner (exit 143, "runner has received a shutdown signal") partway
    # through compiling it, well after its ~30 Boost/Abseil transitive
    # dependencies had already built and cached successfully at full
    # parallelism - onnxruntime's own translation units are large/heavy
    # enough that 4 of them compiling at once exceeds the runner's memory.
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    # CI only builds the Release preset per platform - it's what would
    # actually ship, and vcpkg builds both debug/release variants of every
    # dependency together in one pass regardless, so a Debug leg here would
    # mostly just re-verify the same dependency build under a different
    # CMAKE_BUILD_TYPE. Debug remains fully available locally (`cmake
    # --preset <platform>-debug`) or via a personal CMakeUserPresets.json -
    # it's just not something CI needs to babysit on every push.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # vcpkg's x-gha binary caching provider was removed; 'files' +
      # actions/cache is the simplest supported replacement. Set via
      # GITHUB_ENV since the 'runner' context isn't available in job-level env:.
      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Keyed per vcpkg triplet, not per CMake preset: vcpkg builds both
      # debug and release variants of every package together in one pass,
      # regardless of our own project's build type, so linux-gcc-debug and
      # linux-gcc-release (same x64-linux triplet) would otherwise each
      # cache a near-identical ~1.8GB copy of opencv4/onnxruntime/bgfx.
      # GitHub's 10GB-per-repo cache cap was being exceeded by this
      # duplication across every preset/triplet combination, causing
      # semi-random eviction (confirmed via the cache usage API - 10.7GB
      # across 15 entries, over the limit).
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-${{ matrix.triplet }}-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # No separate GCC 15 install step needed here: ubuntu-26.04 ships
      # GCC 13/14/15 side by side out of the box (unlike ubuntu-24.04, which
      # needed the ppa:ubuntu-toolchain-r/test PPA for g++-15). The
      # -DCMAKE_CXX_COMPILER=g++-15 reference below still resolves.
      #
      # Three distinct vcpkg build gaps on a stock ubuntu-26.04 runner: (1)
      # bgfx's port unconditionally find_package(X11)s even with
      # examples/tools disabled ("Could NOT find X11"); (2) gperf (a
      # transitive dependency via gettext, itself pulled in by
      # onnxruntime/protobuf) needs the autotools chain to build from source
      # ("gperf currently requires ... autoconf autoconf-archive automake
      # libtoolize"); (3) glew's generated glew.pc declares `Requires: glu`, and
      # vcpkg_fixup_pkgconfig() then runs `pkg-config --exists glew`, which
      # fails with "Package 'glu', required by 'glew', not found" (glu.pc
      # comes from libglu1-mesa-dev, which ubuntu-26.04 does not preinstall
      # - the build of glew:x64-linux dies with BUILD_FAILED). All three
      # confirmed in CI.
      - name: Install vcpkg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev libglu1-mesa-dev

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Prebuilt Qt (official binaries) so the GUI app builds without
      # compiling Qt from source. Sets QT_ROOT_DIR for find_package(Qt6).
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          modules: "qtquick3d qtshadertools"
          cache: true

      # AppleClang ships no OpenMP runtime, and the vendored M3T tracker
      # (third_party/m3t) does find_package(OpenMP REQUIRED): without libomp
      # configure fails with "Could NOT find OpenMP_C (missing:
      # OpenMP_C_FLAGS OpenMP_C_LIB_NAMES)" (confirmed in CI). Homebrew's
      # libomp is keg-only, so it is on no default search path; its prefix
      # is handed to CMake via CMAKE_PREFIX_PATH below, which FindOpenMP's
      # find_library()/find_path() honour.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "OPENMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-15' || '' }}
        run: cmake --preset "$CMAKE_PRESET" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR${OPENMP_PREFIX:+;$OPENMP_PREFIX}" $EXTRA_CXX_COMPILER

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  android-build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - Android (arm64-v8a)' || 'Android (arm64-v8a)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',android,') }}
    # ubuntu-26.04, matching every other build agent - see the diagnostic
    # step below for why this needed a closer look before deciding whether
    # to stay here.
    runs-on: ubuntu-26.04
    continue-on-error: true
    # Caps vcpkg's internal build parallelism - see the equivalent comment on
    # build-and-test above. opencv4/onnxruntime/bgfx now build here too (see
    # docs/dependency-strategy.md), including onnxruntime, which already
    # OOM'd desktop runners at default parallelism.
    env:
      VCPKG_MAX_CONCURRENCY: "2"

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # >= v4.0.2: v4.0.1's default `packages: tools platform-tools` asks
      # sdkmanager for the long-removed `tools` package ("Warning: Failed to
      # find package 'tools'", exit code 1), which failed this step after the
      # licences were already accepted. v4.0.2 dropped it from the default.
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # gperf (a transitive dependency, built as a host tool regardless of
      # target triplet) needs these from the system package manager to build
      # from source via autotools - see the equivalent comment on clang-tidy
      # in build-and-test above. No X11/GL packages needed here: bgfx.cmake
      # explicitly excludes ANDROID from its X11 path.
      - name: Install vcpkg build dependencies
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool libltdl-dev

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Keyed per vcpkg triplet (arm64-android) - see the fuller comment on
      # build-and-test above on why per-preset keys were wasteful/over the
      # 10GB cap; keeping the same scheme everywhere avoids reintroducing the
      # same mistake later.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-arm64-android-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-arm64-android-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # All platforms share the same Qt/QML shell (see docs/architecture.md),
      # so this leg installs Qt for Android same as build-and-test installs
      # it for desktop. install-qt-action also provisions the matching host
      # (Linux desktop) Qt and exports QT_HOST_PATH automatically when
      # target: android is set - QT_HOST_PATH_CMAKE_DIR and
      # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH are still passed explicitly
      # since the NDK toolchain defaults CMAKE_FIND_ROOT_PATH_MODE_PACKAGE to
      # ONLY, which would otherwise hide both Qt kits and vcpkg's install
      # tree from find_package() (confirmed locally on windows-msvc/android).
      - name: Install Qt (prebuilt, Android)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          target: android
          arch: android_arm64_v8a
          modules: "qtquick3d qtshadertools"
          cache: true

      # vcpkg now builds opencv4/onnxruntime/bgfx here too, chainloaded onto
      # the NDK toolchain the same way as fmt - see docs/dependency-strategy.md.
      # No libx11-dev install needed: bgfx.cmake explicitly excludes ANDROID
      # from its X11 path. Release only - see the equivalent comment on
      # build-and-test above.
      - name: Configure
        run: >
          cmake --preset android-clang-release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DQT_HOST_PATH="$QT_HOST_PATH"
          -DQT_HOST_PATH_CMAKE_DIR="$QT_HOST_PATH/lib/cmake"
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"

      # CMake's Check*/Find* modules (e.g. FindThreads) only print "Failed"
      # to the main log on failure - the actual compiler/linker error only
      # ever lands in CMakeError.log/CMakeOutput.log inside the build tree.
      # The first attempt at this diagnostic assumed a fixed path and found
      # nothing there (confirmed in CI: the assumed path didn't exist, or
      # CMake never flushed it before the FATAL_ERROR unwound) - this version
      # searches the whole build tree instead of guessing a path, and also
      # dumps the relevant CMakeCache.txt entries in case a stale cached
      # try_compile result (not a fresh failure) is the real culprit.
      - name: Dump CMake diagnostics on configure failure
        if: failure()
        run: |
          echo "::group::find build -iname CMakeError.log/CMakeOutput.log"
          find build -iname "CMakeError.log" -o -iname "CMakeOutput.log" || true
          echo "::endgroup::"
          while IFS= read -r f; do
            echo "::group::$f"
            cat "$f" || true
            echo "::endgroup::"
          done < <(find build -iname "CMakeError.log" -o -iname "CMakeOutput.log" 2>/dev/null || true)
          echo "::group::build/android-clang-release/CMakeFiles listing"
          find build/android-clang-release/CMakeFiles -maxdepth 1 2>&1 || true
          echo "::endgroup::"
          echo "::group::CMakeCache.txt PTHREAD/THREADS entries"
          grep -i "pthread\|thread" build/android-clang-release/CMakeCache.txt 2>&1 || true
          echo "::endgroup::"

      - name: Build
        run: cmake --build --preset android-clang-release

      # androiddeployqt runs automatically as part of the build above and
      # produces a debug-signed APK; upload it so the Qt/QML shell can
      # actually be installed and looked at, not just compiled.
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cube_app-android-arm64-v8a
          path: build/android-clang-release/src/app/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  ios-build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - iOS (device, build-only, unsigned)' || 'iOS (device, build-only, unsigned)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',ios,') }}
    # Pinned to macos-15, not the newer macos-26: confirmed in CI that
    # libwebp's arm64-ios build intermittently fails vcpkg_fixup_pkgconfig
    # on macos-26 ("pkg-config --exists libsharpyuv failed") - a known,
    # still-open vcpkg/pkgconf issue (microsoft/vcpkg#50681), not something
    # to work around here. Revisit once that's resolved upstream.
    runs-on: macos-15
    continue-on-error: true
    # Caps vcpkg's internal build parallelism - see the equivalent comment on
    # build-and-test above. opencv4/onnxruntime/bgfx now build here too (see
    # docs/dependency-strategy.md), including onnxruntime, which already
    # OOM'd desktop runners at default parallelism.
    env:
      VCPKG_MAX_CONCURRENCY: "2"

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Keyed per vcpkg triplet (arm64-ios), shared across debug/release -
      # see the equivalent comment on android-build above.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-arm64-ios-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-arm64-ios-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # Unsigned build only (see the ios-clang-* preset's
      # CODE_SIGNING_ALLOWED=NO cache vars) - no Apple Developer certificate
      # is available in this job. No Qt install needed - see the android job
      # comment above; the same reasoning applies here. vcpkg now builds
      # opencv4/onnxruntime/bgfx here too - see the android job comment
      # above. Release only - see the equivalent comment on build-and-test
      # above.
      - name: Configure
        run: cmake --preset ios-clang-release

      - name: Build
        run: cmake --build --preset ios-clang-release

  coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - Coverage (Linux, GCC)' || 'Coverage (Linux, GCC)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',coverage,') }}
    runs-on: ubuntu-26.04
    # Caps vcpkg's internal build parallelism - see the equivalent comment
    # on build-and-test above (onnxruntime OOM'd this runner at full nproc
    # parallelism).
    env:
      VCPKG_MAX_CONCURRENCY: "2"

    steps:
      # fetch-depth: 0 is required, not just nice-to-have: vcpkg's version
      # resolution does `git read-tree <historical-tree-hash>` against the
      # deps/vcpkg submodule to check out the exact pinned version of each
      # port. A shallow submodule clone (actions/checkout's default) only has
      # the tip commit's objects, so it fails for any port whose pinned tree
      # isn't byte-identical to the tree at HEAD (confirmed in CI: failed on
      # protobuf, a transitive onnxruntime dependency).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure vcpkg binary cache
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Keyed per vcpkg triplet (x64-linux), shared with build-and-test's
      # Linux legs and clang-tidy - see the fuller comment on build-and-test
      # above on why per-preset keys were wasteful/over the 10GB cap.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-binary-cache-x64-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-x64-linux-

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "latest"

      # No separate GCC 15 install step needed here: ubuntu-26.04 ships it
      # out of the box - see the equivalent comment on build-and-test above.
      #
      # Three vcpkg build gaps on ubuntu-26.04 - see the fuller comment on
      # build-and-test above (X11 for bgfx, autotools for gperf, GLU for glew).
      - name: Install vcpkg build dependencies
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev libglu1-mesa-dev

      - name: Install gcovr
        run: pip install --quiet gcovr

      # No GUI app needed to measure coverage of cube::lib/cube::platform, so
      # this leg skips the Qt install entirely.
      - name: Configure
        run: >
          cmake --preset linux-gcc-coverage
          -DCMAKE_CXX_COMPILER=g++-15
          -DCUBEULATOR_BUILD_APP=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-coverage

      - name: Test
        run: ctest --preset linux-gcc-coverage

      - name: Coverage report + gate
        run: >
          gcovr --root . --filter 'src/.*'
          --gcov-executable gcov-15
          --exclude-throw-branches --exclude-unreachable-branches
          --gcov-ignore-errors=no_working_dir_found
          --object-directory build/linux-gcc-coverage
          --print-summary --html-details build/coverage.html
          --fail-under-line 80 --fail-under-branch 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage*.html
