name: Release

# Builds the three desktop packages, signs and attests them, renders the release
# notes from CHANGELOG.md and, for a real release, creates a DRAFT GitHub
# Release. How to cut one is docs/releasing.md.
#
#   push a tag vX.Y.Z[-label.N]      ->  a release: verify, build, sign and
#                                        attest, draft release
#   run by hand, dry_run (default)   ->  a DRY RUN: all of the above except the
#                                        tag and the release. Signed with a
#                                        throwaway key; the files and the notes
#                                        are a workflow artifact to inspect
#   run by hand, dry_run unticked    ->  a release, the tag made at the end
#   a PR that changes the release    ->  only the tools' self-test runs, so that
#   machinery                            GitHub parses this file and a mistake
#                                        shows before a tag does
#
# A release is a deliberate human step (docs/branch-protection.md): the
# workflow leaves the release as a draft, and publishing it is the click that
# makes it public. Packages are not OS code-signed yet (docs/packaging.md); what
# is signed is the SHA-512 manifest and every package, with the project's GPG
# key, and each package carries a build-provenance attestation and an SBOM.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run: build, sign with a throwaway key and render the notes, but
          create no tag and no release. Untick for a real release.
        type: boolean
        default: true
      unsigned:
        description: >-
          Real release only: go ahead without the GPG signature when the
          signing key is not provisioned. Without this a missing key fails the
          release, so that it is never unsigned by accident.
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/check-package.sh"
      - "tools/release/**"

# Nothing is granted by default. Each job asks for exactly what it needs:
# `sign` the OIDC token and attestation write (and holds the GPG key),
# `publish` contents: write (and holds neither).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A release is never abandoned half way because another run started.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      from_unreleased: ${{ steps.check.outputs.from_unreleased }}
      publish: ${{ steps.mode.outputs.publish }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      # The whole history, with the tags: whether a release commit sits on main
      # and whether the tag exists need it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A PR that changes the release machinery proves the file parses and the
      # tools still hold; the packages are built by ci.yml on that PR already.
      - name: Run the release tools' self-test
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: python3 tools/release/test_release_tools.py

      - name: Decide what this run is
        id: mode
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          publish=false
          dry_run=true
          pushed_tag=""
          if [ "$EVENT" = "push" ]; then
            # A tag was pushed: the tag is the release.
            publish=true
            dry_run=false
            pushed_tag="$REF_NAME"
          elif [ "$DRY_RUN_INPUT" = "false" ]; then
            publish=true
            dry_run=false
          fi
          {
            echo "publish=$publish"
            echo "dry_run=$dry_run"
            echo "pushed_tag=$pushed_tag"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT publish=$publish dry_run=$dry_run tag=${pushed_tag:-<made at the end>}"

      # The version is the one CMakeLists.txt declares; the tag, the changelog
      # section and the package names must all agree with it
      # (tools/release/check_release.py says why for each).
      - name: Check the tree and the tag
        id: check
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PUSHED_TAG: ${{ steps.mode.outputs.pushed_tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          args=()
          if [ -n "$PUSHED_TAG" ]; then args+=(--tag "$PUSHED_TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 tools/release/check_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      # main only receives releases (docs/branch-protection.md). A final
      # release must be on it; a pre-release may be cut from a release/* branch
      # to be tried first. A dispatched release makes its tag at the end, so
      # the tag must not exist yet.
      - name: Check where the release is cut from
        if: ${{ github.event_name != 'pull_request' && steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.check.outputs.tag }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          git fetch --no-tags origin main
          if [ "$PRERELEASE" != "true" ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is a final release and $GITHUB_SHA is not on main. Final releases are cut from main, after the develop -> main release PR."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Push a tag to release it again, or prepare a new version."
            exit 1
          fi
          echo "$TAG may be released from $GITHUB_SHA."

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    # A PR that only touches the release machinery proves the workflow parses
    # and the verify job's logic runs; building three platforms for that is not
    # needed (build-and-test in ci.yml builds and checks the packages on that
    # PR).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # See the same cap, and why, on build-and-test in ci.yml.
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025-vs2026
            preset: windows-msvc-release
            triplet: x64-windows
            generators: NSIS
            artifact: windows-x64
          - name: macOS
            os: macos-26
            preset: macos-clang-release
            triplet: arm64-osx
            generators: DragNDrop
            artifact: macos-arm64
          - name: Linux
            os: ubuntu-26.04
            preset: linux-gcc-release
            triplet: x64-linux
            generators: "DEB;RPM"
            artifact: linux-x64

    steps:
      # The whole history, for vcpkg's version resolution: see build-and-test
      # in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Read-only: a release run restores the cache CI built and never writes
      # one, so that nothing a release run does can end up in what the other
      # workflows trust. A cold cache only costs time.
      - name: Restore vcpkg binaries
        uses: $/.github/actions/vcpkg-cache/restore
        with:
          triplet: ${{ matrix.triplet }}

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Install vcpkg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev libglu1-mesa-dev

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm fakeroot desktop-file-utils appstream

      # makensis has to be present at configure time: cmake/Packaging.cmake
      # looks for it then.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version 3.13.0 --no-progress -y
          }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The same Qt as ci.yml's legs, installed the same way (and see there why
      # Windows takes aqtinstall from a pinned commit): a release ships what CI
      # tested.
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
          modules: "qtquick3d qtshadertools"
          cache: true

      # See the same step, and why, in ci.yml.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "OPENMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # The tests are not shipped, so neither they nor Catch2 are built.
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-15' || '' }}
        run: cmake --preset "$CMAKE_PRESET" -DCUBEULATOR_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR${OPENMP_PREFIX:+;$OPENMP_PREFIX}" $EXTRA_CXX_COMPILER

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$CMAKE_PRESET"

      - name: Package
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          PACKAGE_GENERATORS: ${{ matrix.generators }}
        # CPack writes the package to the directory it is run from, the
        # workspace root.
        run: cpack --config "build/${CMAKE_PRESET}/CPackConfig.cmake" -G "${PACKAGE_GENERATORS}"

      # The same assertions CI makes on every push: Qt, the icon, the
      # identifier, the notices. A release that fails them is not published.
      - name: Check the package contents
        shell: bash
        run: packaging/check-package.sh .

      # What the package holds, for the SBOM (tools/release/make_sbom.py): the
      # build's own inventory of what it linked and deployed, which it refuses
      # to package without resolving (docs/licensing.md).
      - name: Keep the third-party inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices-${{ matrix.artifact }}
          path: build/${{ matrix.preset }}/third_party_notices/third-party-notices.json
          if-no-files-found: error

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.artifact }}
          path: |
            Cubeulator-*.exe
            Cubeulator-*.dmg
            Cubeulator-*.deb
            Cubeulator-*.rpm
          if-no-files-found: error

  # Everything between "the packages exist" and "a release exists": the SHA-512
  # manifest, the GPG signatures, the SBOM, the provenance attestations and the
  # notes. It runs in a dry run too, with a throwaway key, so that the first
  # time any of it runs is not the first release. It writes nothing to the
  # repository.
  sign:
    name: Sign, attest and render the notes
    needs: [verify, build]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # the keyless Sigstore identity of this job
      attestations: write # the provenance and SBOM attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the three packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/files

      - name: Check there is one package per platform
        shell: bash
        run: |
          cd dist/files
          ls -l
          # Exactly one package per platform, named for this version, or
          # something is wrong.
          for pattern in "Cubeulator-${VERSION}-windows-x64.exe" "Cubeulator-${VERSION}-macos-arm64.dmg" \
                         "Cubeulator-${VERSION}-linux-x64.deb" "Cubeulator-${VERSION}-linux-x64.rpm"; do
            n=$(find . -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected one $pattern, found $n"
              exit 1
            fi
          done
          n=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$n" -ne 4 ]; then
            echo "::error::expected four packages, found $n files"
            exit 1
          fi

      # The SBOM is made first, so that it is a line of the checksum manifest and
      # under the same GPG signature as the packages are. It says what is
      # INSIDE them, per platform, from the build's own inventory
      # (tools/release/make_sbom.py), not what a scan of an installer sees.
      - name: Download the third-party inventories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: notices-*
          path: inventory

      - name: Make the SBOM (SPDX)
        shell: bash
        run: |
          python3 tools/release/make_sbom.py \
            --version "$VERSION" --tag "$TAG" --repo "$REPO" --files dist/files \
            --notices windows=inventory/notices-windows-x64/third-party-notices.json \
            --notices macos=inventory/notices-macos-arm64/third-party-notices.json \
            --notices linux=inventory/notices-linux-x64/third-party-notices.json \
            --output "dist/files/Cubeulator-${VERSION}.spdx.json"

      # What a downloader checks against, whether or not the signing key exists.
      - name: Write SHA512SUMS
        shell: bash
        run: |
          cd dist/files
          sha512sum Cubeulator-* > SHA512SUMS
          sha512sum --check SHA512SUMS
          cat SHA512SUMS

      # The project's key (the same REPO_GPG_PRIVATE_KEY the sibling projects
      # use) signs the manifest and every package.
      #
      # A real release without the key fails, unless it was told `unsigned`, so
      # that a missing secret cannot turn into an unsigned release unnoticed.
      #
      # A dry run never signs with the real key: its files are a workflow
      # artifact anyone with read access to the repository can download, and
      # signatures from the project's key on files that were never released
      # would be signatures to be mistaken for one. It signs with a key made
      # for the run, and separately proves, in a keyring of its own that is
      # thrown away, that the provisioned key imports and can sign, so that a
      # wrong passphrase is found by the rehearsal and not by the release.
      - name: Sign with GPG
        id: gpg
        shell: bash
        env:
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
          UNSIGNED: ${{ inputs.unsigned }}
          GPG_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          new_home() {
            mkdir -m 700 "$1"
            echo "allow-loopback-pinentry" > "$1/gpg-agent.conf"
          }
          # Exactly one secret key, or "the first" is a guess.
          only_key() {
            if [ "$(gpg --list-secret-keys --with-colons | grep -c '^sec:')" -ne 1 ]; then
              echo "::error::expected exactly one secret key in the keyring"
              exit 1
            fi
            gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}'
          }

          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$GPG_KEY" ]; then
              probe="$RUNNER_TEMP/gnupg-probe"
              new_home "$probe"
              printf '%s' "$GPG_KEY" | GNUPGHOME="$probe" gpg --batch --import
              echo probe > "$RUNNER_TEMP/probe.txt"
              GNUPGHOME="$probe" gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --armor --detach-sign "$RUNNER_TEMP/probe.txt" 3<<<"$GPG_PASSPHRASE"
              GNUPGHOME="$probe" gpg --verify "$RUNNER_TEMP/probe.txt.asc" "$RUNNER_TEMP/probe.txt"
              rm -rf "$probe" "$RUNNER_TEMP"/probe.txt*
              echo "The provisioned signing key imports and signs."
            else
              echo "::warning::REPO_GPG_PRIVATE_KEY is not set: a real release will fail until it is (docs/releasing.md, 'The signing key')."
            fi
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            new_home "$GNUPGHOME"
            gpg --batch --passphrase '' --quick-generate-key "Cubeulator release dry run <dry-run@invalid>" rsa3072 sign 1d
            passphrase=""
          else
            if [ -z "$GPG_KEY" ]; then
              if [ "$UNSIGNED" = "true" ]; then
                echo "::warning::No REPO_GPG_PRIVATE_KEY: this release is NOT GPG-signed (unsigned was ticked)."
                echo "signed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::REPO_GPG_PRIVATE_KEY is not set. Provision the signing key (docs/releasing.md, 'The signing key'), or dispatch with 'unsigned' ticked to release without a signature."
              exit 1
            fi
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            new_home "$GNUPGHOME"
            printf '%s' "$GPG_KEY" | gpg --batch --import
            passphrase="$GPG_PASSPHRASE"
          fi

          keyid=$(only_key)
          gpg --armor --export "$keyid" > dist/files/cubeulator-signing-key.asc

          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --armor --detach-sign "$1" 3<<<"$passphrase"
          }
          cd dist/files
          for f in SHA512SUMS Cubeulator-*.exe Cubeulator-*.dmg Cubeulator-*.deb Cubeulator-*.rpm Cubeulator-*.spdx.json; do
            sign "$f"
            gpg --verify "$f.asc" "$f"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signed SHA512SUMS, the SBOM and four packages with key $keyid."

      # Keyless SLSA provenance: which repository, workflow and commit built
      # these bytes. The GPG signature says who vouches for them; the two are
      # complementary. `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/files/*.exe
            dist/files/*.dmg
            dist/files/*.deb
            dist/files/*.rpm

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/files/*.exe
            dist/files/*.dmg
            dist/files/*.deb
            dist/files/*.rpm
          sbom-path: dist/files/Cubeulator-${{ needs.verify.outputs.version }}.spdx.json

      # The attestation is only worth the notes' sentence about it if it
      # verifies. A short retry: it can take a moment to be readable.
      - name: Verify the attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/files/*.exe dist/files/*.dmg dist/files/*.deb dist/files/*.rpm; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              if gh attestation verify "$f" --repo "$REPO" > /dev/null 2>&1; then
                ok=true
                break
              fi
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::no verifiable attestation for $f"
              exit 1
            fi
            echo "attested: $f"
          done

      # The notes are the changelog's section laid out the way every release of
      # the family reads (tools/release/render_release_notes.py). What the
      # table says was done is what this job did.
      - name: Render the release notes
        id: notes
        shell: bash
        env:
          SIGNED: ${{ steps.gpg.outputs.signed }}
          FROM_UNRELEASED: ${{ needs.verify.outputs.from_unreleased }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --tag "$TAG" --repo "$REPO"
                --artifacts dist/files --attested --sbom --output dist/notes.md)
          if [ "$SIGNED" = "true" ]; then args+=(--signed); fi
          if [ "$FROM_UNRELEASED" = "true" ]; then args+=(--from-unreleased); fi
          python3 tools/release/render_release_notes.py "${args[@]}"
          {
            echo "### Release notes for $TAG"
            echo
            cat dist/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the files and the notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Say what this run did
        shell: bash
        env:
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run"
              echo
              echo "Nothing was tagged or published. The files that would be attached, and \`notes.md\`, are the \`release-$VERSION\` artifact of this run."
              echo "They were signed with a key made for this run, so \`gpg --verify\` needs the \`cubeulator-signing-key.asc\` in the artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Create the draft release
    needs: [verify, sign]
    if: ${{ needs.verify.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      # Make the tag (a dispatched release) and create the release. Nothing
      # else in this workflow can write to the repository, and this job holds
      # neither the signing key nor the OIDC identity.
      contents: write
    steps:
      - name: Download the release files and notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: dist

      # A tag push already has its tag. A dispatched release makes it here, at
      # the end, on the commit that was built: a run that failed earlier leaves
      # no tag behind. Made with the workflow's token, so it does not start a
      # second run of this workflow.
      - name: Make the tag (dispatched release)
        id: tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged $GITHUB_SHA as $TAG."

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          ls -l files
          flags=(--draft --verify-tag --title "$TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # A re-run finds the draft it made last time and replaces it.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber files/*
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$REPO" "${flags[@]}" files/*
          fi
          echo "Draft release for $TAG is ready for review."

      # If the tag was made here and the release could not be, do not leave a
      # tag that names nothing.
      - name: Remove the tag this run made
        if: ${{ failure() && steps.tag.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "A release exists for $TAG: leaving the tag."
          else
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG"
            echo "Deleted the tag $TAG: no release was made for it."
          fi
