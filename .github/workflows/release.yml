name: Release

# Builds the three desktop packages and, for a version tag, attaches them to a
# DRAFT GitHub Release. How to cut one is docs/releasing.md.
#
#   push a tag vX.Y.Z (or vX.Y.Z-rc.1)  ->  build, check, create a draft release
#   run it by hand                       ->  build and check only; the packages
#                                            are workflow artifacts, nothing is
#                                            created, a dry run of the release
#   a PR that changes this file          ->  only the cheap verify job runs, so
#                                            that GitHub parses the file and a
#                                            mistake shows before a tag does
#
# A release is a deliberate human step (docs/branch-protection.md): the
# workflow leaves the release as a draft, and publishing it is the click that
# makes it public. The packages are NOT code-signed; the release notes say so.
# Where signing plugs in is docs/packaging.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/check-package.sh"

# Nothing is granted by default. The one job that writes (publish) asks for
# exactly contents: write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A release is never abandoned half way because another run started.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # The whole history: whether a release tag sits on main needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the project
        id: check
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # project(Cubeulator VERSION x.y.z ...) in the top-level CMakeLists.txt.
          project_version=$(awk '/^project\(Cubeulator/{f=1} f && /VERSION/{print $2; exit}' CMakeLists.txt)
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read the project version from CMakeLists.txt (got '$project_version')"
            exit 1
          fi
          echo "project version: $project_version"

          if [ "$REF_TYPE" != "tag" ]; then
            echo "Not a tag: a dry run. The packages are built and checked, and nothing is published."
            {
              echo "version=$project_version"
              echo "publish=false"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::tag '$REF_NAME' is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          core="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[3]}"

          # The packages are named for the project's version, so a tag that
          # disagrees would publish v1.2.0 containing Cubeulator-1.1.0-*.
          if [ "$core" != "$project_version" ]; then
            echo "::error::tag $REF_NAME says $core but CMakeLists.txt says $project_version. Bump project(VERSION) first, then tag the commit that has it."
            exit 1
          fi

          # main only receives tagged releases (docs/CONTRIBUTING.md). A final
          # release must be on it; a pre-release (a suffix) may be cut from a
          # release/* branch to be tried first.
          if [ -z "$suffix" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$REF_NAME is not on main. A final release is tagged on main, after the develop -> main release PR."
              exit 1
            fi
          fi

          prerelease=false
          if [ -n "$suffix" ] || [ "${project_version%%.*}" = "0" ]; then
            prerelease=true
          fi
          {
            echo "version=$project_version"
            echo "publish=true"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "release $REF_NAME: version $project_version, prerelease=$prerelease"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    # A PR that only touches this file proves the workflow parses and the
    # verify job's logic runs; building three platforms for that is not needed
    # (build-and-test in ci.yml builds and checks the packages on that PR).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # See the same cap, and why, on build-and-test in ci.yml.
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025-vs2026
            preset: windows-msvc-release
            triplet: x64-windows
            generators: NSIS
            artifact: windows-x64
          - name: macOS
            os: macos-26
            preset: macos-clang-release
            triplet: arm64-osx
            generators: DragNDrop
            artifact: macos-arm64
          - name: Linux
            os: ubuntu-26.04
            preset: linux-gcc-release
            triplet: x64-linux
            generators: "DEB;RPM"
            artifact: linux-x64

    steps:
      # The whole history, for vcpkg's version resolution: see build-and-test
      # in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Read-only: a release run restores the cache CI built and never writes
      # one, so that nothing a release run does can end up in what the other
      # workflows trust. A cold cache only costs time.
      - name: Restore vcpkg binaries
        uses: $/.github/actions/vcpkg-cache/restore
        with:
          triplet: ${{ matrix.triplet }}

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Install vcpkg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev libglu1-mesa-dev

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm fakeroot desktop-file-utils appstream

      # makensis has to be present at configure time: cmake/Packaging.cmake
      # looks for it then.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version 3.13.0 --no-progress -y
          }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The same Qt as ci.yml's legs, installed the same way (and see there why
      # Windows takes aqtinstall from a pinned commit): a release ships what CI
      # tested.
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
          modules: "qtquick3d qtshadertools"
          cache: true

      # See the same step, and why, in ci.yml.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "OPENMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # The tests are not shipped, so neither they nor Catch2 are built.
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-15' || '' }}
        run: cmake --preset "$CMAKE_PRESET" -DCUBEULATOR_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR${OPENMP_PREFIX:+;$OPENMP_PREFIX}" $EXTRA_CXX_COMPILER

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$CMAKE_PRESET"

      - name: Package
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          PACKAGE_GENERATORS: ${{ matrix.generators }}
        run: cpack --config "build/${CMAKE_PRESET}/CPackConfig.cmake" -G "${PACKAGE_GENERATORS}"

      # The same assertions CI makes on every push: Qt, the icon, the
      # identifier, the notices. A release that fails them is not published.
      - name: Check the package contents
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: packaging/check-package.sh "build/${CMAKE_PRESET}"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/Cubeulator-*.exe
            build/${{ matrix.preset }}/Cubeulator-*.dmg
            build/${{ matrix.preset }}/Cubeulator-*.deb
            build/${{ matrix.preset }}/Cubeulator-*.rpm
          if-no-files-found: error

  publish:
    name: Create the draft release
    needs: [verify, build]
    if: ${{ needs.verify.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      # Create the release and attach the packages. Nothing else in this
      # workflow can write to the repository.
      contents: write
    steps:
      - name: Download the three packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          cd packages
          ls -l
          # Exactly one package per platform, or something is wrong.
          for pattern in 'Cubeulator-*-windows-x64.exe' 'Cubeulator-*-macos-arm64.dmg' \
                         'Cubeulator-*.deb' 'Cubeulator-*.rpm'; do
            n=$(find . -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected one $pattern, found $n"
              exit 1
            fi
          done

          sha256sum Cubeulator-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          cat > notes.md <<EOF
          Desktop packages for Cubeulator ${VERSION}.

          | Platform | Package |
          |---|---|
          | Windows 10 and later, 64-bit | \`Cubeulator-${VERSION}-windows-x64.exe\` |
          | macOS 14.4 and later, Apple Silicon | \`Cubeulator-${VERSION}-macos-arm64.dmg\` |
          | Linux, Debian and Ubuntu | \`Cubeulator-${VERSION}-linux-x64.deb\` |
          | Linux, Fedora and openSUSE | \`Cubeulator-${VERSION}-linux-x64.rpm\` |

          **These packages are not code-signed.**

          - **Windows:** SmartScreen may say "Windows protected your PC". Choose *More info*, then *Run anyway*.
          - **macOS:** the app carries an ad-hoc signature and is not notarised. The first time, right-click it and choose *Open*, or use *Open Anyway* in System Settings > Privacy & Security.
          - **Linux:** \`sudo apt install ./Cubeulator-${VERSION}-linux-x64.deb\`, or \`sudo dnf install ./Cubeulator-${VERSION}-linux-x64.rpm\`.

          Check a download against \`SHA256SUMS.txt\`.
          EOF

          flags=(--draft --verify-tag --title "Cubeulator ${VERSION}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # A re-run finds the draft it made last time and replaces its files.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber Cubeulator-* SHA256SUMS.txt
          else
            gh release create "$TAG" --repo "$REPO" "${flags[@]}" Cubeulator-* SHA256SUMS.txt
          fi
          echo "Draft release for $TAG is ready for review."
