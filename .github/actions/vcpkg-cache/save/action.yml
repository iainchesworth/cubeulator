name: Save vcpkg binary cache
description: >-
  Saves the vcpkg binary cache if packages were added since ../restore, under
  a key named after the cache's contents. Meant to run with `if: always()` so
  a failing build keeps the packages vcpkg had already built.

inputs:
  triplet:
    description: vcpkg triplet the cache is keyed on; the same value as ../restore.
    required: true
  restored:
    description: The `listing` output of ../restore.
    required: true

runs:
  using: composite
  steps:
    - name: Decide whether anything new was built
      id: state
      shell: bash
      env:
        RESTORED: ${{ inputs.restored }}
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-cache"
        cd "$RUNNER_TEMP/vcpkg-cache"
        packages=$(LC_ALL=C ls -R . | grep -c '\.zip$' || true)
        listing=$(LC_ALL=C ls -R . | sha256sum | cut -c1-16)
        changed=false
        if [ "$packages" -gt 0 ] && [ "$listing" != "$RESTORED" ]; then
          changed=true
        fi
        echo "listing=$listing" >> "$GITHUB_OUTPUT"
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "vcpkg cache: $packages package(s); restored $RESTORED, now $listing; save=$changed"

    # Keyed by content, not by run: a clean run that built nothing new saves
    # nothing, and jobs that built the same set (the four x64-linux jobs)
    # produce the same key, so only the first one stores it (the rest get
    # "another job may be creating this cache" and carry on).
    - name: Save
      if: steps.state.outputs.changed == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-binary-cache-${{ inputs.triplet }}-${{ steps.state.outputs.listing }}
