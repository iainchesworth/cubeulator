site_name: Cubeulator
site_description: A camera-driven, on-device Rubik's Cube solver.
site_url: https://iainchesworth.github.io/cubeulator/
repo_url: https://github.com/iainchesworth/cubeulator
repo_name: iainchesworth/cubeulator
edit_uri: edit/develop/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Building & packaging: building.md
  - Testing & coverage: testing.md
  - Architecture: architecture.md
  - Dependency strategy: dependency-strategy.md
  - FAQ / troubleshooting: faq.md
  - Contributing: CONTRIBUTING.md
  - Code of conduct: CODE_OF_CONDUCT.md
  - Security policy: SECURITY.md
  - For maintainers:
      - CI & dependencies: ci.md
      - Branch protection: branch-protection.md
