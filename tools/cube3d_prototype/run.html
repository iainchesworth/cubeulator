<!doctype html>
<!--
  The page the WebAssembly build of cube3d_prototype is run from. A page has no
  command line, so the address's query becomes one: run.html?mode=lift&size=7
  &moves=40&solve=1 starts the program as `cube3d_prototype --mode lift --size 7
  --moves 40 --solve`. A flag (solve, vsync) is on unless its value is 0.

  Beside the files the Qt WebAssembly kit writes (cube3d_prototype.js,
  qtloader.js); serve the directory with Cross-Origin-Opener-Policy:
  same-origin and Cross-Origin-Embedder-Policy: require-corp.
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>
    <title>cube3d_prototype</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
    <div id="status">Loading...</div>
    <div id="screen"></div>
    <script src="cube3d_prototype.js"></script>
    <script src="qtloader.js"></script>
    <script>
      const FLAGS = new Set(['solve', 'vsync']);

      function commandLine(query) {
        const arguments_ = [];
        for (const [key, value] of new URLSearchParams(query)) {
          if (FLAGS.has(key)) {
            if (value !== '0') arguments_.push('--' + key);
          } else {
            arguments_.push('--' + key, value);
          }
        }
        return arguments_;
      }

      async function init() {
        const status = document.querySelector('#status');
        const screen = document.querySelector('#screen');
        try {
          await qtLoad({
            arguments: commandLine(window.location.search),
            qt: {
              onLoaded: () => { status.style.display = 'none'; },
              onExit: (exit) => { status.style.display = 'block'; status.textContent = 'Exited: ' + (exit.code ?? ''); },
              entryFunction: window.cube3d_prototype_entry,
              containerElements: [screen],
            },
          });
        } catch (e) {
          console.error(e);
          status.textContent = String(e);
        }
      }
    </script>
  </body>
</html>
