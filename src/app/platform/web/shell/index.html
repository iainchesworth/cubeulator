<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cubeulator</title>
  <meta name="description" content="Cubeulator in your browser: point a camera at a scrambled Rubik's Cube and get a step-by-step solution. Everything runs on your device.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    /* The app's own tokens (src/app/qt/Theme.qml): paper, ink and the
       detected-sticker teal, light and dark. */
    :root {
      --paper: #F3F2F2;
      --ink: #201E1D;
      --muted: rgba(32, 30, 29, 0.62);
      --accent: #2F7D7B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1A1918;
        --ink: #F3F2F2;
        --muted: rgba(243, 242, 242, 0.62);
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Qt sizes its canvas to this element. */
    #screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    #status[hidden] { display: none; }
    #status img { width: 72px; height: 72px; }
    #status h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.01em; }
    #status p { margin: 0; max-width: 34rem; color: var(--muted); }
    #status a { color: var(--accent); }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.problem .spinner { display: none; }
    #status.problem h1 { color: var(--accent); }
  </style>
</head>
<body>
  <div id="screen" aria-label="Cubeulator" role="application"></div>

  <div id="status" role="status" aria-live="polite">
    <img src="icon.svg" alt="">
    <h1>Cubeulator</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="message">Loading. The first visit downloads the app (about 15 MB) and restarts the page once; later visits start from your browser's cache.</p>
    <p><a href="../">Documentation</a></p>
  </div>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-content:center;padding:24px;text-align:center">
      Cubeulator needs JavaScript and WebAssembly to run in the browser.
    </p>
  </noscript>

  <!-- Threads need SharedArrayBuffer, which needs cross-origin isolation, which
       a static host cannot send headers for: see cubeulator-isolation.js. -->
  <script src="cubeulator-isolation.js"></script>
  <script>
    (function () {
      'use strict';

      const status = document.getElementById('status');
      const message = document.getElementById('message');

      function problem(text) {
        status.classList.add('problem');
        status.hidden = false;
        message.textContent = text;
      }

      function webgl2Available() {
        try {
          return !!document.createElement('canvas').getContext('webgl2');
        } catch (e) {
          return false;
        }
      }

      function load(script, then) {
        const element = document.createElement('script');
        element.src = script;
        element.onload = then;
        element.onerror = function () { problem('Could not load ' + script + '. Check your connection and reload.'); };
        document.head.appendChild(element);
      }

      function start() {
        if (typeof WebAssembly !== 'object') {
          problem('This browser does not support WebAssembly, which Cubeulator needs.');
          return;
        }
        if (!webgl2Available()) {
          problem('This browser, or this device\'s graphics driver, does not offer WebGL 2, which Cubeulator draws with.');
          return;
        }
        if (!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
          problem('Cubeulator needs threads, which this page could not enable.' +
            (window.cubeulatorIsolation && window.cubeulatorIsolation.error ? ' ' + window.cubeulatorIsolation.error : ''));
          return;
        }

        // ?demo=<number> opens on the solve screen with a cube scrambled from
        // that seed and no camera (main.cpp's CUBE_SOLVE_DEMO), which is how to
        // see the app without a camera; &move=<n> opens n moves in and
        // &size=<n> makes it a cube of that side length, 2 to 9. Digits
        // only: these become environment variables of the program.
        const query = new URLSearchParams(window.location.search);
        const environment = {};
        const demo = query.get('demo');
        if (demo !== null && /^[0-9]{1,9}$/.test(demo)) {
          environment.CUBE_SOLVE_DEMO = demo;
          const move = query.get('move');
          if (move !== null && /^[0-9]{1,3}$/.test(move)) {
            environment.CUBE_SOLVE_DEMO_MOVE = move;
          }
          const size = query.get('size');
          if (size !== null && /^[0-9]$/.test(size)) {
            environment.CUBE_SOLVE_DEMO_SIZE = size;
          }
        }

        // A page that embeds this one for testing (tests/web, through
        // Playwright's addInitScript) can set window.cubeulatorEnvironment
        // before the app starts, to pass it the CUBEULATOR_* switches its
        // diagnostics build reads. Names and values are held to a safe shape.
        const extra = window.cubeulatorEnvironment;
        if (extra && typeof extra === 'object') {
          Object.keys(extra).forEach(function (name) {
            const value = String(extra[name]);
            if (/^CUBEULATOR_[A-Z_]{1,40}$/.test(name) && /^[0-9A-Za-z_.-]{0,64}$/.test(value)) {
              environment[name] = value;
            }
          });
        }

        // The Emscripten module (defines cube_app_entry), then Qt's loader.
        load('cube_app.js', function () {
          load('qtloader.js', function () {
            const screen = document.getElementById('screen');
            qtLoad({
              qt: {
                entryFunction: window.cube_app_entry,
                containerElements: [screen],
                environment: environment,
                onLoaded: function () { status.hidden = true; },
                onExit: function (exit) {
                  if (exit && exit.crashed) {
                    problem('Cubeulator stopped unexpectedly' + (exit.text ? ': ' + exit.text : '') + '. Reload the page to start again.');
                  } else {
                    problem('Cubeulator has closed. Reload the page to start again.');
                  }
                },
              },
            }).catch(function (error) {
              problem('Cubeulator could not start: ' + error);
            });
          });
        });
      }

      if (window.cubeulatorIsolation && (window.cubeulatorIsolation.ready || window.cubeulatorIsolation.error)) {
        start();
      } else {
        window.addEventListener('cubeulator-isolated', start, { once: true });
      }
    })();
  </script>
</body>
</html>
