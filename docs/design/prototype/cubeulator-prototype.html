<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cubeulator Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a workbench. One bar of prototype controls, then the app itself in a
   device frame. On a phone the frame goes away and the app is the page. */
:root{--paper:#F3F2F2;--surface:#EAE9E9;--ink:#201E1D;--inkSecondary:#5E5B5A;--inkDisabled:#858281;--outline:#858281;--divider:#C9C7C6;--accent:#EC3013;--accentText:#B82009;--accentFill:#B82009;--accentFillHover:#A51903;--accentFillPress:#9E1702;--onAccent:#FFFFFF;--accentTint:#FFF2EF;--ok:#286F6D;--caution:#8A5800;--hoverWash:#E4E2E2;--pressWash:#DCDAD9;--cubeBody:#1B1A1A;--cubeEdge:#201E1D;--ov-panel:#141312;--ov-ink:#F3F2F2;--ov-inkSecondary:#D9D6D4;--ov-ok:#5FE07A;--ov-caution:#FFB347;--ov-outline:#9C9998;--ov-scrim:#141312;--ov-panel-a:0.86;--cube-white:#F2F0EC;--mark-white:#201E1D;--cube-yellow:#F6CA3F;--mark-yellow:#201E1D;--cube-orange:#F87E0F;--mark-orange:#201E1D;--cube-red:#CD3B37;--mark-red:#FFFFFF;--cube-green:#4EB584;--mark-green:#201E1D;--cube-blue:#0D5792;--mark-blue:#FFFFFF;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1A1918;--surface:#242220;--ink:#F3F2F2;--inkSecondary:#B0ACAB;--inkDisabled:#7A7776;--outline:#7A7776;--divider:#3A3836;--accent:#EC3013;--accentText:#FF7359;--accentFill:#FF5A3D;--accentFillHover:#FF6B50;--accentFillPress:#FF7D65;--onAccent:#1A1918;--accentTint:#3A1A14;--ok:#5ABDBA;--caution:#E0A030;--hoverWash:#2E2C2A;--pressWash:#343230;--cubeBody:#0E0D0D;--cubeEdge:#8C8988;}}
:root[data-theme="dark"]{--paper:#1A1918;--surface:#242220;--ink:#F3F2F2;--inkSecondary:#B0ACAB;--inkDisabled:#7A7776;--outline:#7A7776;--divider:#3A3836;--accent:#EC3013;--accentText:#FF7359;--accentFill:#FF5A3D;--accentFillHover:#FF6B50;--accentFillPress:#FF7D65;--onAccent:#1A1918;--accentTint:#3A1A14;--ok:#5ABDBA;--caution:#E0A030;--hoverWash:#2E2C2A;--pressWash:#343230;--cubeBody:#0E0D0D;--cubeEdge:#8C8988;}
.device[data-app-theme="light"]{--paper:#F3F2F2;--surface:#EAE9E9;--ink:#201E1D;--inkSecondary:#5E5B5A;--inkDisabled:#858281;--outline:#858281;--divider:#C9C7C6;--accent:#EC3013;--accentText:#B82009;--accentFill:#B82009;--accentFillHover:#A51903;--accentFillPress:#9E1702;--onAccent:#FFFFFF;--accentTint:#FFF2EF;--ok:#286F6D;--caution:#8A5800;--hoverWash:#E4E2E2;--pressWash:#DCDAD9;--cubeBody:#1B1A1A;--cubeEdge:#201E1D;}
.device[data-app-theme="dark"]{--paper:#1A1918;--surface:#242220;--ink:#F3F2F2;--inkSecondary:#B0ACAB;--inkDisabled:#7A7776;--outline:#7A7776;--divider:#3A3836;--accent:#EC3013;--accentText:#FF7359;--accentFill:#FF5A3D;--accentFillHover:#FF6B50;--accentFillPress:#FF7D65;--onAccent:#1A1918;--accentTint:#3A1A14;--ok:#5ABDBA;--caution:#E0A030;--hoverWash:#2E2C2A;--pressWash:#343230;--cubeBody:#0E0D0D;--cubeEdge:#8C8988;}

:root{
  --pg-bg:#D6D3D2; --pg-fg:#201E1D; --pg-muted:#514E4D; --pg-line:#A8A4A3; --pg-panel:#F3F2F2; --pg-frame:#201E1D;
  --f-head:'Archivo','Helvetica Neue',Arial,'Noto Sans',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pg-bg:#0C0B0B; --pg-fg:#F3F2F2; --pg-muted:#B0ACAB; --pg-line:#4A4745; --pg-panel:#1A1918; --pg-frame:#8C8988; color-scheme:dark}}
:root[data-theme="dark"]{
  --pg-bg:#0C0B0B; --pg-fg:#F3F2F2; --pg-muted:#B0ACAB; --pg-line:#4A4745; --pg-panel:#1A1918; --pg-frame:#8C8988; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font-family:var(--f-head);font-size:14px;overflow:hidden}
button,select{font:inherit;color:inherit}
svg.cvd{position:absolute;width:0;height:0}

/* ---- the workbench ------------------------------------------------------ */
.bench{height:100%;display:flex;flex-direction:column}
.pbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px;padding:8px 16px;background:var(--pg-panel);border-bottom:2px solid var(--pg-frame)}
.pbar h1{font:800 13px/1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;margin:0 6px 9px 0}
.pf{display:flex;flex-direction:column;gap:3px;min-width:0}
.pf label{font:700 10px/1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--pg-muted)}
.pf select,.pbtn{height:30px;border:1px solid var(--pg-line);background:var(--pg-panel);border-radius:0;padding:0 8px;font-size:13px;max-width:100%}
.pbtn{cursor:pointer;font-weight:700}
.pbtn:hover,.pf select:hover{border-color:var(--pg-fg)}
.pbar :focus-visible{outline:2px solid var(--pg-fg);outline-offset:2px}
.popts{display:contents}
.pgrow{flex:1}
#p-toggle{display:none}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.device{position:relative;background:var(--paper);color:var(--ink);border:2px solid var(--pg-frame);overflow:hidden;flex:none}
.device[data-size="phone"]{width:390px;height:min(780px,100%)}
.device[data-size="side"]{width:min(780px,100%);height:min(390px,100%)}
.device[data-size="desktop"]{width:min(1180px,100%);height:min(740px,100%)}
@media (max-width:699px){
  .pbar{padding:6px 16px;gap:6px 8px;align-items:center}
  .pbar h1,.pgrow{display:none}
  #p-toggle{display:block}
  .popts{display:none}
  .pbar.open .popts{display:contents}
  .pf.size{display:none}
  .pbar>.pf{flex:1 1 0}
  .pbar>.pf label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .pbar>.pf select{width:100%}
  .pbtn{padding:0 8px}
  .stagewrap{padding:0}
  .device,.device[data-size]{width:100%;height:100%;border:0}
}
#map{position:absolute;inset:0;background:var(--pg-bg);overflow:auto;padding-block:20px;padding-inline:16px;z-index:5}
#map h2{font:800 22px/1.1 var(--f-head);margin:0 0 4px}
#map p{margin:0 0 16px;color:var(--pg-muted);max-width:70ch;line-height:1.45}
.spine{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:8px}
.node{border:2px solid var(--pg-fg);background:var(--pg-panel);padding:8px 10px;min-width:118px;cursor:pointer;text-align:start;border-radius:0;display:flex;flex-direction:column;gap:3px}
.node:hover{background:var(--pg-bg)}
.node b{font:800 15px/1.1 var(--f-head)}
.node small{font:500 11px/1.2 var(--f-mono);color:var(--pg-muted)}
.node.lane-scan{border-style:dashed}.node.lane-solve{border-style:double;border-width:4px}
.arrow{align-self:center;font:500 18px/1 var(--f-mono);color:var(--pg-muted)}
.maprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:20px}
.mapcard{background:var(--pg-panel);border:1px solid var(--pg-line);padding:12px}
.mapcard h3{font:800 15px/1.1 var(--f-head);margin:0 0 2px}
.mapcard .lane{font:500 11px/1.2 var(--f-mono);color:var(--pg-muted);margin-bottom:8px}
.mapcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mapcard li button{all:unset;cursor:pointer;display:block;width:100%;padding:4px 6px;font:500 12px/1.3 var(--f-mono);box-sizing:border-box}
.mapcard li button:hover{background:var(--pg-bg)}
.mapcard li button:focus-visible{outline:2px solid var(--pg-fg)}
.mapcard li span{display:block;font:400 12px/1.35 var(--f-head);color:var(--pg-muted)}
.icons{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:8px}
.icons figure{margin:0;display:flex;flex-direction:column;gap:6px;font:500 11px/1.2 var(--f-mono);color:var(--pg-muted)}
.icons .tile{background:#F3F2F2;display:grid;place-items:center;border:1px solid var(--pg-line)}
.icons svg{display:block;width:100%;height:100%}
.loops{margin-top:20px;border-collapse:collapse;font-size:13px}
.loops td{padding:4px 12px 4px 0;border-bottom:1px solid var(--pg-line);vertical-align:top}
.loops td:first-child{font-family:var(--f-mono);white-space:nowrap}

/* ---- the app: tokens come from tokens.json ------------------------------- */
.app{position:absolute;inset:0;container:app / size;--ts:1;--rem:calc(16px * var(--ts));
  font:400 var(--rem)/1.45 var(--f-head);color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
.app *{min-width:0}
.app h1,.app h2,.app p{margin:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden auto}
.screen.enter{animation:fade var(--m-screen,280ms) cubic-bezier(.22,.61,.36,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.t-display{font:800 calc(var(--rem)*2.25)/1 var(--f-head);letter-spacing:-.01em;text-wrap:balance}
.t-title{font:800 calc(var(--rem)*1.75)/1.1 var(--f-head);text-wrap:balance}
.t-headline{font:700 calc(var(--rem)*1.375)/1.2 var(--f-head);text-wrap:balance}
.t-small{font-size:calc(var(--rem)*.875)}
.t-sec{color:var(--inkSecondary)}
.eyebrow{font:700 calc(var(--rem)*.8125)/1.2 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--accentText)}
.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.app :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.on-cam :focus-visible{outline-color:var(--ov-ink)}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .ico.flip{transform:scaleX(-1)}

.btn{font:800 var(--rem)/1.2 var(--f-head);min-height:48px;padding:10px 18px;border:2px solid transparent;background:none;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:0;text-align:start;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accentFill);color:var(--onAccent)}
.btn.primary:hover{background:var(--accentFillHover)}
.btn.primary:active{background:var(--accentFillPress)}
.btn.secondary{border-color:var(--outline)}
.btn.ghost{color:var(--accentText);padding-inline:10px}
.btn.secondary:hover,.btn.ghost:hover{background:var(--hoverWash)}
.btn.secondary:active,.btn.ghost:active{background:var(--pressWash)}
.btn.block{display:flex;width:100%;justify-content:space-between}
.btn.thumb{min-height:56px}
.btn.giant{min-height:96px;font-size:calc(var(--rem)*1.25);padding-inline:12px}
.btn[disabled]{color:var(--inkDisabled);border-color:var(--divider);background:none;cursor:default}
.btn.primary[disabled]{background:var(--surface);color:var(--inkDisabled);border-color:var(--divider)}
.kbd{font:500 calc(var(--rem)*.8125)/1 var(--f-mono);border:1px solid currentColor;padding:3px 6px;opacity:.85}
.iconbtn{width:56px;height:56px;display:inline-grid;place-items:center;background:none;border:2px solid transparent;border-radius:0;color:var(--ink);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--hoverWash)}
.iconbtn .ico{width:26px;height:26px}

.notice{display:flex;gap:12px;padding:12px 14px;border:2px solid var(--outline);background:var(--surface);align-items:flex-start}
.notice .ico{margin-top:2px;color:var(--caution);width:22px;height:22px}
.notice strong{display:block;font-weight:800}
.notice .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card{border:2px solid var(--ink);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}

.scrim{position:absolute;inset:0;background:rgba(20,19,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet,.dialog{background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;max-height:100%;overflow:auto}
.sheet{border-inline:0;border-bottom:0}
.sheet .btn,.dialog .btn{min-height:56px}
.sheet .note{color:var(--inkSecondary);font-size:calc(var(--rem)*.875);margin-top:-8px;padding-inline:20px}
.dialog{max-width:400px;margin:auto 16px}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.dialog .acts .btn{flex:1 1 auto}
.sheet ol{margin:0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px}
@container app (min-width:600px){.scrim{align-items:center}.sheet{max-width:440px;border:2px solid var(--ink)}}

.stk{display:grid;place-items:center;background:var(--c);--c:var(--surface)}
.stk svg{width:100%;height:100%;display:block}
.stk[data-c="white"]{--c:var(--cube-white);color:var(--mark-white)}
.stk[data-c="yellow"]{--c:var(--cube-yellow);color:var(--mark-yellow)}
.stk[data-c="orange"]{--c:var(--cube-orange);color:var(--mark-orange)}
.stk[data-c="red"]{--c:var(--cube-red);color:var(--mark-red)}
.stk[data-c="green"]{--c:var(--cube-green);color:var(--mark-green)}
.stk[data-c="blue"]{--c:var(--cube-blue);color:var(--mark-blue)}
.swatch{width:1.5em;height:1.5em;border:2px solid var(--cubeEdge);flex:none}
canvas{display:block;width:100%;height:100%}
[hidden]{display:none!important}
.home-cube,.hold-cube,.done-cube,.solve-stage{position:relative}
.home-cube canvas,.hold-cube canvas,.done-cube canvas,.solve-stage canvas{position:absolute;inset:0}
.work{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;padding:24px;text-align:center}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;background:var(--accent);animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}40%{opacity:1}}
.still .dots i{animation:none;opacity:1}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;padding-inline:4px 16px;border-bottom:2px solid var(--divider);flex:none}
.topbar h1{font:800 calc(var(--rem)*1.125)/1.2 var(--f-head)}
.pad{padding:24px;display:flex;flex-direction:column;gap:16px}

/* ---- home ------------------------------------------------------------------ */
.home{display:grid;grid-template-rows:auto minmax(110px,1fr) auto;padding:24px;gap:16px}
.home-cube{min-height:0}
.home-copy{display:flex;flex-direction:column;gap:12px}
.home-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.home-foot{display:flex;flex-wrap:wrap;gap:0 4px;border-top:2px solid var(--divider);padding-top:8px;justify-content:space-between}
.status-line{display:flex;gap:10px;align-items:center;color:var(--inkSecondary)}
@container app (min-width:840px){
  .home{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;padding:0;gap:0}
  .home>.eyebrow{grid-column:1;padding:40px 40px 0}
  .home-copy{grid-column:1;grid-row:2;padding:24px 40px 32px;justify-content:center;max-width:560px}
  .home-cube{grid-column:2;grid-row:1 / span 2;background:var(--surface);border-inline-start:2px solid var(--divider);padding:40px}
  .home .t-display{font-size:calc(var(--rem)*2.75)}
  .home-actions{flex-direction:row;flex-wrap:wrap}
  .home-actions .btn.block{width:auto;gap:24px}
  .home-foot{justify-content:flex-start;gap:0 16px;margin-top:24px}
}
@container app (max-height:479px){
  .home{grid-template-columns:1fr 1.3fr;grid-template-rows:auto 1fr;padding:16px 24px;gap:8px 24px}
  .home>.eyebrow{grid-column:1 / -1}
  .home-cube{grid-column:1;grid-row:2}
  .home-copy{grid-column:2;grid-row:2;gap:8px}
  .home .t-display{font-size:calc(var(--rem)*1.5)}
  .home .lede{display:none}
}

/* ---- scan -------------------------------------------------------------------- */
.scan{background:#141312;color:var(--ov-ink);overflow:hidden}
.scan canvas.cam{position:absolute;inset:0}
.scan-top,.scan-bottom{position:absolute;inset-inline:0;padding:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.scan-top{top:0;align-items:flex-start}
.scan-bottom{bottom:0;align-items:center;gap:12px}
.scan-top>*,.scan-bottom>*{pointer-events:auto}
.panel{background:rgba(20,19,18,var(--ov-panel-a));padding:12px 16px;display:flex;flex-direction:column;gap:4px;max-width:520px;width:100%}
.panel .t-headline{display:flex;gap:10px;align-items:center}
.panel p{color:var(--ov-inkSecondary)}
.panel.caution .ico{color:var(--ov-caution)}
.panel.done .ico{color:var(--ov-ok)}
.proto-tag{position:absolute;inset-inline-end:8px;top:8px;font:500 11px/1 var(--f-mono);color:#8C8988;pointer-events:none}
.chips{display:flex;gap:8px;justify-content:center;width:100%}
.chip{flex:0 1 96px;min-width:44px;aspect-ratio:1;background:rgba(20,19,18,var(--ov-panel-a));border:1px solid var(--ov-outline);position:relative;padding:5px}
.chip .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;height:100%;direction:ltr}
.chip.inview{border:3px solid var(--ov-ink);padding:3px}
.chip.inview::before{content:"";position:absolute;inset-inline-start:50%;top:-11px;margin-inline-start:-7px;border:7px solid transparent;border-top-color:var(--ov-ink);border-bottom:0}
.chip.ok{border:3px solid var(--ov-ok);padding:3px}
.chip .tick{position:absolute;inset-inline-end:-6px;top:-6px;width:20px;height:20px;background:var(--ov-ok);color:#141312;display:grid;place-items:center}
.chip .tick .ico{width:14px;height:14px;stroke-width:3.2}
.chip .fill{position:absolute;inset-inline:5px;bottom:5px;height:6px;background:rgba(243,242,242,.25)}
.chip .fill i{display:block;height:100%;background:var(--ov-ok);animation:fill var(--dur,1300ms) linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.chip.arrive{animation:arrive 240ms ease-out}
@keyframes arrive{0%{transform:scale(.8)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.scan-btns,.scan-ctx{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.scan .btn.secondary{color:var(--ov-ink);border-color:var(--ov-outline);background:rgba(20,19,18,var(--ov-panel-a))}
.scan .btn.secondary:hover{background:#2E2C2A}
.scan .btn.secondary[disabled]{color:#8C8988;border-color:#4A4745}
.scan .btn.primary{background:#FF5A3D;color:#1A1918}
.scan-btns .btn{flex:1 1 0;max-width:200px;padding-inline:8px}
@container app (max-height:479px){
  .scan-bottom{inset-inline-start:auto;top:0;width:auto;justify-content:flex-end;align-items:flex-end}
  .scan-top{inset-inline-end:40%}
  .chips{display:grid;grid-template-columns:repeat(3,56px);width:auto}
  .scan-btns{flex-direction:column;align-items:flex-end;width:auto}
  .scan-btns .btn{flex:none;min-width:180px}
}

/* ---- solve ------------------------------------------------------------------- */
.solve{overflow:hidden}
.solve-bar{display:flex;align-items:center;gap:8px;padding-inline-end:16px;flex:none}
.solve-bar .where{flex:1;display:flex;flex-direction:column;gap:2px}
.prog{height:6px;background:var(--divider);flex:none;position:relative}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent)}
.prog b{position:absolute;inset-block:-3px;width:2px;background:var(--ink)}
.solve-body{flex:1;min-height:0;display:flex;flex-direction:column}
.solve-stage{flex:1;min-height:140px;position:relative;cursor:pointer;border:0;background:none;padding:0;display:block;width:100%}
.holdline{display:flex;gap:8px;align-items:center;justify-content:center;padding:4px 16px;color:var(--inkSecondary);font-size:calc(var(--rem)*.875);flex-wrap:wrap;text-align:center}
.holdline .swatch{width:1.1em;height:1.1em}
.solve-side{display:flex;flex-direction:column;flex:none}
.ins{padding:8px 20px 12px;display:flex;flex-direction:column;gap:4px}
.ins-side{display:flex;align-items:center;gap:12px;font:800 calc(var(--rem)*2)/1.1 var(--f-head)}
.ins-side .swatch{width:1em;height:1em}

/* ---- complete ------------------------------------------------------------------ */

.stats{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--divider)}
.stats div{padding:12px 16px}.stats div+div{border-inline-start:2px solid var(--divider)}

.done-actions{display:flex;flex-direction:column;gap:8px}

  .complete{grid-template-columns:5fr 7fr;grid-template-rows:1fr;padding:0;gap:0}

/* ---- pages, rows, switches, choices ------------------------------------------ */
.page{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.col{width:100%;max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.split{flex:1;min-height:0;display:flex;flex-direction:column}
.split>.pane{flex:1;min-height:0}
.aside{display:none;position:relative}
@container app (min-width:840px){
  .split{flex-direction:row}
  .split>.pane{flex:1.1;padding:40px}
  .aside{display:block;flex:1;background:var(--surface);border-inline-start:2px solid var(--divider)}

}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid var(--divider);background:none;color:var(--ink);
  font:inherit;text-align:start;width:100%;cursor:pointer;border-radius:0;-webkit-tap-highlight-color:transparent}
.row:hover{background:var(--hoverWash)}

.row>.ico{color:var(--inkSecondary)}

.sect>.rows{border-top:0}
.switch{width:52px;height:32px;border:2px solid var(--outline);position:relative;flex:none}
.switch i{position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;background:var(--outline);display:grid;place-items:center}
.switch .ico{width:16px;height:16px;stroke-width:3.2;display:none}
.row[aria-checked="true"] .switch{background:var(--accentFill);border-color:var(--accentFill)}

.setting{display:flex;flex-direction:column;gap:6px;padding:8px 4px;border-bottom:1px solid var(--divider)}
.choice{display:flex;flex-wrap:wrap}

.steps .n,.shead .n{width:32px;height:32px;flex:none;display:grid;place-items:center;border:2px solid var(--ink)}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.points .ico{color:var(--ok);stroke-width:2.6;margin-top:2px}

.empty{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;max-width:440px}
.notice.ok .ico{color:var(--ok)}
.notice.info .ico{color:var(--ink)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:34em}
.lockup{display:flex;gap:16px;align-items:center}

/* ---- review and hand entry ------------------------------------------------------ */
/* Compact: one column that fits the window. The big side takes what height is left, so the
   palette and Solve are on screen with it; the column scrolls only when even 168 px will not fit. */
.review{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sides{display:flex;gap:6px}
.sidebtn{flex:1;min-width:44px;height:56px;border:2px solid var(--outline);background:none;display:grid;place-items:center;position:relative;cursor:pointer;padding:0;border-radius:0;color:var(--ink)}
.sidebtn .stk{width:28px;height:28px;border:2px solid var(--cubeEdge)}
.sidebtn:hover{background:var(--hoverWash)}
.sidebtn[aria-pressed="true"]{border:3px solid var(--ink);background:var(--accentTint)}
.sidebtn .tick,.pal .tick{position:absolute;top:-3px;inset-inline-end:-3px;width:18px;height:18px;background:var(--ok);color:var(--paper);display:grid;place-items:center}
.tick .ico{width:13px;height:13px;stroke-width:3.4}

.cell.unset .stk{background:var(--paper);outline:2px dashed var(--outline);outline-offset:-8px}
.cell.centre{cursor:default}
.rv-pal{display:flex;flex-direction:column;gap:6px}
.palette{display:flex;gap:6px;direction:ltr}
.pal{flex:1;min-width:44px;height:56px;border:2px solid var(--cubeEdge);padding:0;cursor:pointer;border-radius:0;display:grid;position:relative;background:none}
.pal .stk{width:100%;height:100%}
.pal[aria-pressed="true"]{border:4px solid var(--ink)}
.pal .tick{background:var(--ink)}

.rv-net span{aspect-ratio:1;display:grid;border:1px solid var(--cubeEdge)}
.rv-net span.unset{background:var(--paper);border-style:dashed;border-color:var(--outline)}

.rv-acts .primary{flex:1}

eloper": "Developer", "settings.dev.backend": "Graphics backend. Running %1.", "settings.dev.restart": "Restart Cubeulator to switch to this backend.", "settings.dev.cubeStyle": "Cube style", "settings.dev.stats": "Show frame rate", "settings.dev.recording": "This developer build records failed scans on this device.", "settings.dev.diagnostics": "Write diagnostics to a file", "settings.dev.diagnosticsFrames": "Also keep camera frames", "settings.dev.diagnosticsSnapshot": "Snapshot now", "diagnostics.marker": "Writing diagnostics to %1", "diagnostics.markerFrames": "Writing diagnostics and camera frames to %1", "about.title": "About Cubeulator", "about.version": "Version %1", "about.what": "A camera-driven solver for the 3x3 cube.", "about.author": "Made by %1.", "about.licence": "Free software under the GNU General Public License, version 3 or later.", "about.source": "Source code", "about.licences": "Licences", "about.privacy": "Privacy", "about.trademark": "Cubeulator is not affiliated with the makers of any cube.", "about.build": "%1 · built from %2", "about.copyBuild": "Copy", "about.copyDetails": "Copy details for a bug report", "about.copyDetails.note": "Text only: the version, this device and the app's settings. No picture, and nothing about your cube.", "about.copied": "Copied", "licences.title": "Licences", "licences.intro": "Cubeulator is built with these components. Each is used under its own licence.", "licences.own": "Cubeulator", "licences.unavailable.title": "The notices could not be loaded", "licences.unavailable.body": "They are also published with the source code at %1.", "privacy.title": "Privacy", "privacy.camera.title": "The camera", "privacy.camera.body": "The camera picture is used on this device to read your cube's colours. No picture is saved, and nothing is sent anywhere.", "privacy.history.title": "Solve history", "privacy.history.body": "Cubeulator keeps a list of the cubes you have solved: the colours, the turns, the date and how long it took. It stays on this device. You can clear it, or turn it off, in Settings.", "privacy.network.title": "The internet", "privacy.network.body": "Cubeulator does not use the internet. It has no accounts, no adverts and no tracking.", "help.title": "Help", "help.howItWorks": "How it works", "help.scanning": "Scanning the cube", "help.entering": "Entering colours by hand", "help.holding": "Holding the cube", "help.turns": "What the words mean", "help.lost": "If the cube does not match", "help.cubes": "Which cubes work", "help.notation": "Cube notation", "help.keys": "Keyboard", "help.scanning.body": "Hold the cube so that one side faces the camera flat, filling about half the picture.\n\nKeep it still until that side appears in the row at the bottom. Then turn to another side. The order does not matter, and it does not matter which way up each side is.\n\nUse bright, even light. If a sticker shines, tilt the cube a little until the shine goes. A window behind you is better than a window behind the cube.\n\nIf a side will not read, you can enter the colours by hand.", "help.entering.body": "Choose a colour, then tap every sticker of that colour on the side you are looking at. Then choose the next colour.\n\nDo one side at a time. The centre of each side is filled in already: it never changes, and it tells you which side you are on.\n\nIt does not matter which way up you hold each side. Cubeulator works that out.\n\nWhen every sticker is filled in, Cubeulator checks that the colours make a real cube. If they do not, compare each side with your cube again.", "help.holding.body": "For the whole solve, hold the cube the same way round: the side with the yellow centre on top, the side with the green centre facing you.\n\nLook at the centres only. The other stickers move; the centres never do.\n\nAfter a turn, do not turn the whole cube round to look at it. If you do, put it back: yellow centre on top, green centre facing you.\n\nProp this device up where you can see it with both hands on the cube.", "help.turns.body": "A side is one of the six sides of the cube. Each is named by where it is as you hold it: top, bottom, left, right, front and back.\n\nA turn moves one side a quarter of the way round, or half way.\n\nThe top and bottom turn to the left or to the right. The left and right sides turn upwards or downwards: that is the way the part facing you moves. The front and back turn clockwise or anticlockwise, always as you see it from the front.\n\nThe picture shows every turn. If the words and the picture ever seem to disagree, follow the picture.", "help.lost.body": "If your cube stops matching the picture, one turn has probably gone the wrong way.\n\nFirst check how you are holding it: yellow centre on top, green centre facing you.\n\nThen go back one turn and compare again.\n\nIf it still does not match, scan the cube again. Cubeulator solves it from where it is now, so nothing is lost but a little time.", "help.cubes.body": "Cubeulator works with an ordinary 3x3 cube: nine coloured stickers on each side, with dark plastic between them, in white, yellow, red, orange, green and blue.\n\nIt does not yet read cubes without stickers, cubes made of white or light plastic, cubes with pictures, or cubes in other colours. You can still enter one of those by hand if its six colours can be matched to the six here.\n\nIt does not work with other sizes of cube.", "help.notation.body": "Cubers write turns as letters. Cubeulator can show them beside its own words: turn on Show cube notation in Settings.\n\nU is the top, D the bottom, L the left, R the right, F the front and B the back.\n\nA letter alone is a quarter turn clockwise, as you would see it looking straight at that side. An apostrophe after it means anticlockwise. A 2 means a half turn.\n\nThat is why the bottom and the back can seem to go the wrong way: in notation, clockwise is judged from underneath and from behind. Cubeulator's own words are always from where you are.", "help.keys.body": "On the solve screen, Space, Enter or Page Down moves to the next turn. Page Up goes back one. P pauses. Esc leaves and keeps your place.\n\nEverywhere, Tab moves to the next control, Space or Enter presses it, and Esc goes back.\n\nF1 opens Help.", "menu.file": "File", "menu.newScan": "New Scan", "menu.view": "View", "menu.window": "Window", "menu.settings": "Settings…", "menu.quit": "Quit Cubeulator", "menu.helpItem": "Cubeulator Help", "menu.enterByHand": "Enter Colours by Hand", "menu.closeWindow": "Close Window", "menu.help": "Help", "menu.enterFullScreen": "Enter Full Screen", "menu.exitFullScreen": "Exit Full Screen", "menu.minimise": "Minimise", "menu.zoom": "Zoom", "menu.bringAllToFront": "Bring All to Front", "store.summary": "Scan your cube with the camera, then follow one turn at a time until it is solved.", "store.caption.1": "Scan. Solve. In your hands.", "store.caption.2": "Show each side to the camera", "store.caption.3": "Follow one turn at a time", "store.caption.4": "See what each stage is for", "store.caption.5": "Colours you can tell apart", "store.caption.6": "Solved"}, "JOURNEY": [{"screen": "home", "lane": "experience", "states": [{"id": "default", "when": "A camera is available; nothing unfinished"}, {"id": "finding-camera", "when": "Desktop, at start-up, while cameras are being listed"}, {"id": "no-camera", "when": "Desktop; no camera was found"}, {"id": "camera-unsupported", "when": "This build cannot use this device's camera: every phone until mobile capture exists"}, {"id": "resume", "when": "An unfinished solve is stored. Combines with any state above"}, {"id": "confirm-discard", "when": "Dialog over home.resume"}]}, {"screen": "first-run", "lane": "experience", "states": [{"id": "welcome", "when": "First launch, before home has ever been shown"}, {"id": "revisit", "when": "Opened from Help > How it works"}]}, {"screen": "permission", "lane": "experience", "states": [{"id": "ask", "when": "Camera access has not been asked for"}, {"id": "refused", "when": "Access was refused, or the device does not allow it"}]}, {"screen": "scan", "lane": "scan", "states": [{"id": "starting", "when": "The camera is opening"}, {"id": "settling", "when": "Exposure and colour balance are being fixed. Nothing is read"}, {"id": "looking", "when": "Running; no side read; no cube in view"}, {"id": "in-view", "when": "A side is seen but is not steady"}, {"id": "reading", "when": "The side is steady and counting. The next chip fills"}, {"id": "next-side", "when": "One to five sides read; none in view"}, {"id": "seen-before", "when": "The side in view is one already read; its chip is marked"}, {"id": "stuck", "when": "No new side for 10 seconds. A hint panel is added to whichever state is current"}, {"id": "conflict", "when": "Six sides are in and do not make a valid cube"}, {"id": "complete", "when": "Six sides make one valid cube. Held for at least 1.4 s while the solution is worked out"}, {"id": "solve-failed", "when": "The cube was read but no solution could be worked out"}, {"id": "resuming", "when": "The app came back to the front, or the lid was opened, mid-scan. The camera restarts; sides already read are kept"}, {"id": "camera-none", "when": "No camera"}, {"id": "camera-busy", "when": "Another program is using the camera"}, {"id": "camera-blocked", "when": "The operating system refuses access (Windows privacy settings, a Linux portal, macOS after a refusal)"}, {"id": "camera-lost", "when": "The camera stopped or was unplugged mid-scan. Sides read are kept"}, {"id": "camera-failed", "when": "Any other camera error. Shows the error code for a bug report"}, {"id": "more", "when": "Sheet: Enter by hand, Choose a camera (desktop, more than one), Switch camera (phone), Help with scanning, Settings"}, {"id": "camera-picker", "when": "Sheet listing cameras. Desktop"}, {"id": "confirm-leave", "when": "Dialog. Back or Cancel with at least one side read"}, {"id": "confirm-restart", "when": "Dialog. Start over with ckend, cube style, frame-rate display"}, {"id": "restart-needed", "when": "Developer builds: a backend was chosen that needs a restart"}]}, {"screen": "about", "lane": "experience", "states": [{"id": "default", "when": "Opened from Settings, or the macOS application menu"}]}, {"screen": "licences", "lane": "experience", "states": [{"id": "list", "when": "Cubeulator's own licence and one row per third-party component"}, {"id": "detail", "when": "One component's notice in full"}, {"id": "unavailable", "when": "The generated notices could not be loaded"}]}, {"screen": "privacy", "lane": "experience", "states": [{"id": "default", "when": "The statement: no picture is saved; history stays on this device; no internet"}]}, {"screen": "help", "lane": "experience", "states": [{"id": "topics", "when": "The list of topics"}, {"id": "scanning", "when": "Holding the cube for the camera; light; glare"}, {"id": "entering", "when": "Entering the colours by hand"}, {"id": "holding", "when": "Holding the cube for the solve: yellow on top, green facing you"}, {"id": "turns", "when": "What the words mean: side, layer, turn; the six directions; quarter and half"}, {"id": "lost", "when": "When the cube does not match the picture"}, {"id": "cubes", "when": "Which cubes work and which do not"}, {"id": "notation", "when": "The letters, for anyone who has switched them on"}, {"id": "keys", "when": "Keyboard keys. Desktop only"}]}], "MARKS": {"white": "none", "yellow": "ring", "orange": "slash", "red": "plus", "green": "dot", "blue": "bar"}, "IDENTITY": {"icon-android-foreground": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\">\n<polygon points=\"512.0,327.7 751.4,465.9 512.0,604.2 272.6,465.9\" fill=\"#201E1D\" stroke=\"#201E1D\" stroke-width=\"27.6\" stroke-linejoin=\"round\"/>\n<polygon points=\"751.4,465.9 512.0,604.2 512.0,788.5 751.4,650.2\" fill=\"#F3F2F2\" stroke=\"#201E1D\" stroke-width=\"27.6\" stroke-linejoin=\"round\"/>\n<polygo const scenes = {
  home: {

    draw(ctx, w, h, now) {

    }
  },
  solve: {
    live: now => !!S.anim || (!reduced() && pendingMove() && ['move', 'move-hint', 'last-move', 'auto', 'turning'].includes(P.state)),
    draw(ctx, w, h, now) {
      let turn = null;

        const k = Math.min(1, (now - S.anim.t0) / S.anim.dur);
        turn = {f: S.anim.m.f, angle: turnAngle(S.anim.m.t) * ease(k)};
        if (k >= 1) { const done = S.anim; S.anim = null; done.then(); turn = null; }

      if (!turn && m && P.screen === 'solve' && ['move', 'move-hint', 'last-move', 'auto'].includes(P.state)) {

        const lean = reduced() ? .16 : .2 * (0.5 - 0.5 * Math.cos((now % 1800) / 1800 * 2 * Math.PI));

      const shown = ['complete', 'solve-failed'].includes(ph) ? 'D' : cur;

const N = SOL.moves.length;

const SV = {playing: false, timer: 0};

function solStep(dir) {
  if (dir > 0 && S.turn >= N) return solStop();

  const m = dir > 0 ? SOL.moves[S.turn] : {f: SOL.moves[S.turn - 1].f, t: 4 - SOL.moves[S.turn - 1].t};
  play(m, () => { applyMove(S.cube, m); S.turn += dir; if (S.turn >= N) solStop(); if (P.screen === 'solution') { P.state = solState(); render(); } });
}

  enter(st, o) {

bind('#p-motion', 'motion'); bind('#p-notation', 'notation', v => v === 'on');
$('#p-advance').addEventListener('change', e => {
  P.opts.advance = e.target.value;
  if (P.screen === 'solve' && ['move', 'auto', 'auto-paused', 'move-hint'].includes(P.state)) P.state = e.target.value === 'timer' ? 'auto' : 'move';
  applyOpts(); armTimer();
});
pScreen.addEventListener('change', e => { const j = JOURNEY.find(s => s.screen === e.target.value); go(j.screen, j.states[0].id, {picked: true}); });
pState.addEventListener('change', e => go(P.screen, e.target.value, {push: false, picked: true}));
$('#p-run').addEventListener('click', () => { sim.auto = true; if (!DUR[sim.phase]) scanSet(sim.sides.length >= 6 ? 'complete' : 'next-side'); else scanSet(sim.phase); });
$('#p-toggle').addEventListener('click', e => { const open = $('#pbar').classList.toggle('open'); e.target.setAttribute('aria-expanded', open); });

const LOOPS = [
  ['solve → scan', 'My cube does not match: scan the cube again. The new scan replaces the solve.'],
  ['complete → scan', 'Scan another cube; or My cube is not solved.'],
  ['scan ↔ review', 'Check the colours from a scan that does not add up; Scan instead from hand entry.'],
  ['solve → home → solve', 'Leaving keeps the solve. Home offers Carry on.'],
  ['scan, solve → settings, help', 'Opened from the More sheet or the pause menu. Back returns with the scan or solve as it was.']
];
function showMap(on) {
  const map = $('#map');
  map.hidden = !on; device.hidden = on;
  $('#p-map').textContent = on ? 'Back to the app' : 'Map';
  if (!on) return render();
  const node = n => { const j = JOURNEY.find(s => s.screen === n); return `<button type="button" class="node lane-${j.lane}" data-map="${n}.${j.states[0].id}"><b>${n}</b><small>${j.states.length} states · ${j.lane}</small></button>`; };
  const spine = ['first-run', 'home', 'permission', 'scan', 'review', 'solve', 'complete', 'solution'].map(node).join('<span class="arrow">→</span>');
  const side = ['history', 'settings', 'about', 'licences', 'privacy', 'help'].map(node).join('');
  map.innerHTML = `<h2>The journey</h2><p>Every screen and every state, from docs/design/journey.md. The top row is the way through; the second row hangs off Home and Settings. Dashed boxes belong to the scan lane, double-ruled to the solve lane. Choose any state to see it.</p>
    <div class="spine">${spine}</div><div class="spine">${side}</div>
    <table class="loops">${LOOPS.map(l => `<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join('')}</table>
    <div class="maprow">${JOURNEY.map(s => `<div class="mapcard"><h3>${s.screen}</h3><div class="lane">${s.lane} lane${screens[s.screen] ? '' : ' · next cut'}</div><ul>${s.states.map(x => `<li><button type="button" data-map="${s.screen}.${x.id}">${s.screen}.${x.id}<span>${esc(x.when)}</span></button></li>`).join('')}</ul></div>`).join('')}</div>
    <h2 style="margin-top:32px">Identity</h2><p>The icon proposal, from docs/design/identity: the app's own drawing of a cube with its top layer part-way through a turn. The small version drops the grid lines.</p>
    <div class="icons">${[['icon', 128], ['icon-dark', 128], ['icon-android-foreground', 128], ['icon-mono', 128], ['icon-small', 48], ['icon-small', 32], ['icon-small', 16]].map(([n, px]) => `<figure><div class="tile" style="width:${px}px;height:${px}px">${IDENTITY[n] || ''}</div><figcaption>${n.replace('icon-', '').replace('icon', 'light')} ${px}</figcaption></figure>`).join('')}</div>`;
}
$('#p-map').addEventListener('click', () => showMap($('#map').hidden));
$('#map').addEventListener('click', e => { const b = e.target.closest('[data-map]'); if (!b) return; const [s, st] = b.dataset.map.split('.'); showMap(false); go(s, st, {picked: true}); });

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  const tgt = e.target instanceof Element ? e.target : document.body;
  if (!$('#map').hidden || tgt.closest('.pbar')) return;
  if (e.key === 'Escape') { e.preventDefault(); return back(); }
  if (P.screen === 'review' && /^[1-6]$/.test(e.key) && !app.querySelector('.scrim')) { RV.colour = Object.keys(MARKS)[+e.key - 1]; RV.centre = false; return render(); }
  if (P.screen !== 'solve' || app.querySelector('.scrim')) return;
  const onControl = tgt.closest('button,select,a');
  const fwd = P.opts.dir === 'rtl' ? 'ArrowLeft' : 'ArrowRight', bwd = P.opts.dir === 'rtl' ? 'ArrowRight' : 'ArrowLeft';
  const advance = () => { const st = P.state; if (['hold', 'hold-resume'].includes(st)) actions.holdReady(); else if (st === 'stage-done') actions.stageGo(); else if (st === 'auto') actions.autoPause(); else if (st === 'auto-paused') actions.autoGo(); else nextTurn(); };
  if ((e.key === ' ' || e.key === 'Enter') && !onControl) { e.preventDefault(); advance(); }
  else if (e.key === fwd || e.key === 'PageDown') { e.preventDefault(); advance(); }
  else if (e.key === bwd || e.key === 'PageUp') { e.preventDefault(); prevTurn(); }
});
new ResizeObserver(redraw).observe(app);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { palette(); redraw(); });
new MutationObserver(() => { palette(); redraw(); }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

try { Object.assign(P.opts, JSON.parse(localStorage.getItem('cubeulator-proto') || '{}')); } catch (e) {}
const SAVED_SIZE = P.opts.size;
if (narrow()) P.opts.size = 'phone';
let seen = false;
try { seen = !!localStorage.getItem('cubeulator-proto-seen'); } catch (e) {}
if (!seen) { P.screen = 'first-run'; P.state = 'welcome'; }
applyOpts();
</script>

</body>
</html>
